<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep space gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="35%" stop-color="#0a1628"/>
      <stop offset="70%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Electric blue glow -->
    <radialGradient id="glow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan secondary glow -->
    <radialGradient id="glow2" cx="30%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080c18" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Line glow filter -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Particle gradient -->
    <radialGradient id="particleGrad">
      <stop offset="0%" stop-color="#4aa3ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4aa3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ambient glows -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Perspective grid -->
  <g opacity="0.08" stroke="#4aa3ff" stroke-width="0.5">
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="700" x2="1920" y2="700"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="300" y1="1080" x2="960" y2="0"/>
    <line x1="620" y1="1080" x2="960" y2="0"/>
    <line x1="940" y1="1080" x2="960" y2="0"/>
    <line x1="1260" y1="1080" x2="960" y2="0"/>
    <line x1="1580" y1="1080" x2="960" y2="0"/>
  </g>

  <!-- Constellation nodes (representing AI agents) -->
  <g filter="url(#nodeGlow)">
    <!-- Central hub node -->
    <circle cx="960" cy="420" r="18" fill="#4aa3ff" opacity="0.9"/>
    <circle cx="960" cy="420" r="8" fill="#ffffff" opacity="0.8"/>

    <!-- Satellite nodes -->
    <circle cx="760" cy="320" r="12" fill="#00e5ff" opacity="0.85"/>
    <circle cx="1160" cy="320" r="12" fill="#00e5ff" opacity="0.85"/>
    <circle cx="660" cy="520" r="14" fill="#4aa3ff" opacity="0.8"/>
    <circle cx="1260" cy="520" r="14" fill="#4aa3ff" opacity="0.8"/>
    <circle cx="860" cy="620" r="10" fill="#00e5ff" opacity="0.75"/>
    <circle cx="1060" cy="620" r="10" fill="#00e5ff" opacity="0.75"/>
    <circle cx="560" cy="400" r="9" fill="#4aa3ff" opacity="0.7"/>
    <circle cx="1360" cy="400" r="9" fill="#4aa3ff" opacity="0.7"/>
  </g>

  <!-- Constellation connections -->
  <g filter="url(#lineGlow)" stroke="#4aa3ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M960,420 L760,320"/>
    <path d="M960,420 L1160,320"/>
    <path d="M960,420 L660,520"/>
    <path d="M960,420 L1260,520"/>
    <path d="M960,420 L860,620"/>
    <path d="M960,420 L1060,620"/>
    <path d="M760,320 L560,400"/>
    <path d="M1160,320 L1360,400"/>
    <path d="M660,520 L860,620"/>
    <path d="M1260,520 L1060,620"/>
    <path d="M760,320 L660,520"/>
    <path d="M1160,320 L1260,520"/>
  </g>

  <!-- Floating particles -->
  <g fill="url(#particleGrad)">
    <circle cx="400" cy="280" r="3" opacity="0.7"/>
    <circle cx="520" cy="180" r="2" opacity="0.5"/>
    <circle cx="680" cy="240" r="4" opacity="0.6"/>
    <circle cx="820" cy="150" r="2.5" opacity="0.8"/>
    <circle cx="1100" cy="200" r="3.5" opacity="0.7"/>
    <circle cx="1250" cy="160" r="2" opacity="0.5"/>
    <circle cx="1400" cy="280" r="4" opacity="0.6"/>
    <circle cx="1500" cy="350" r="2.5" opacity="0.4"/>
    <circle cx="1580" cy="450" r="3" opacity="0.5"/>
    <circle cx="350" cy="600" r="2" opacity="0.4"/>
    <circle cx="450" cy="750" r="3.5" opacity="0.6"/>
    <circle cx="600" cy="680" r="2" opacity="0.5"/>
    <circle cx="1320" cy="720" r="3" opacity="0.6"/>
    <circle cx="1450" cy="650" r="2.5" opacity="0.5"/>
    <circle cx="1550" cy="780" r="3.5" opacity="0.4"/>
    <circle cx="420" cy="480" r="2" opacity="0.3"/>
    <circle cx="1480" cy="520" r="2" opacity="0.3"/>
  </g>

  <!-- Large lens flare highlight (subtle) -->
  <ellipse cx="960" cy="400" rx="120" ry="60" fill="#4aa3ff" opacity="0.03"/>
</svg>