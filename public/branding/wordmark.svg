<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="wmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa3ff"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="wmCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="wmMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="wmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo mark (left) -->
  <g transform="translate(70, 80) scale(0.55)" filter="url(#wmGlow)">
    <!-- Connection lines -->
    <g stroke-width="4" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-55" x2="-48" y2="35" stroke="url(#wmBlue)"/>
      <line x1="0" y1="-55" x2="48" y2="35" stroke="url(#wmCyan)"/>
      <line x1="-48" y1="35" x2="48" y2="35" stroke="url(#wmMetal)"/>
    </g>
    <!-- Nodes -->
    <circle cx="0" cy="-55" r="20" fill="#0f172a" stroke="url(#wmBlue)" stroke-width="3"/>
    <circle cx="0" cy="-55" r="10" fill="url(#wmBlue)" opacity="0.8"/>
    <circle cx="0" cy="-55" r="4" fill="#ffffff" opacity="0.6"/>

    <circle cx="-48" cy="35" r="20" fill="#0f172a" stroke="url(#wmCyan)" stroke-width="3"/>
    <circle cx="-48" cy="35" r="10" fill="url(#wmCyan)" opacity="0.8"/>
    <circle cx="-48" cy="35" r="4" fill="#ffffff" opacity="0.6"/>

    <circle cx="48" cy="35" r="20" fill="#0f172a" stroke="url(#wmMetal)" stroke-width="3"/>
    <circle cx="48" cy="35" r="10" fill="url(#wmMetal)" opacity="0.8"/>
    <circle cx="48" cy="35" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Wordmark text -->
  <text x="160" y="95" fill="#e2e8f0" font-size="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-1">App</text>
  <text x="310" y="95" fill="#4aa3ff" font-size="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-1">Forge</text>

  <!-- Subtle underline accent -->
  <rect x="160" y="105" width="260" height="3" rx="1.5" fill="url(#wmBlue)" opacity="0.6"/>
</svg>