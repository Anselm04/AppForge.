<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="plannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa3ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="coderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="reviewerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="dataFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="agentGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#pipeBg)"/>

  <!-- Data flow streams between agents -->
  <g filter="url(#softGlow)" stroke-width="3" fill="none" opacity="0.6">
    <path d="M280,300 C400,200 500,200 600,250" stroke="url(#plannerGrad)"/>
    <path d="M280,300 C400,400 500,400 600,350" stroke="url(#plannerGrad)"/>
    <path d="M680,250 C800,280 900,250 1000,220" stroke="url(#coderGrad)"/>
    <path d="M680,350 C800,320 900,350 1000,380" stroke="url(#coderGrad)"/>
  </g>

  <!-- Floating code particles along streams -->
  <g fill="#ffffff" opacity="0.7">
    <rect x="350" y="240" width="16" height="10" rx="2" fill="#4aa3ff"/>
    <rect x="380" y="220" width="10" height="10" rx="2" fill="#4aa3ff"/>
    <rect x="420" y="260" width="20" height="8" rx="2" fill="#4aa3ff"/>
    <rect x="480" y="230" width="12" height="12" rx="2" fill="#00e5ff"/>
    <rect x="520" y="280" width="14" height="10" rx="2" fill="#00e5ff"/>
    <rect x="750" y="260" width="18" height="8" rx="2" fill="#00e5ff"/>
    <rect x="820" y="240" width="10" height="10" rx="2" fill="#00e5ff"/>
    <rect x="880" y="270" width="16" height="10" rx="2" fill="#a855f7"/>
    <rect x="920" y="230" width="12" height="8" rx="2" fill="#a855f7"/>
  </g>

  <!-- Floating UI wireframe elements -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.4" fill="none">
    <rect x="360" y="350" width="40" height="25" rx="4"/>
    <line x1="365" y1="358" x2="395" y2="358"/>
    <line x1="365" y1="365" x2="390" y2="365"/>
    <rect x="420" y="330" width="35" height="20" rx="3"/>
    <line x1="425" y1="336" x2="450" y2="336"/>
    <rect x="760" y="340" width="45" height="30" rx="4"/>
    <line x1="765" y1="348" x2="800" y2="348"/>
    <line x1="765" y1="355" x2="795" y2="355"/>
    <line x1="765" y1="362" x2="785" y2="362"/>
  </g>

  <!-- PLANNER AGENT (left) -->
  <g transform="translate(200, 300)" filter="url(#agentGlow)">
    <circle r="65" fill="#0f172a" stroke="url(#plannerGrad)" stroke-width="3"/>
    <circle r="45" fill="url(#plannerGrad)" opacity="0.15"/>
    <circle r="25" fill="url(#plannerGrad)" opacity="0.6"/>
    <circle r="10" fill="#ffffff" opacity="0.8"/>
    <!-- Brain/planning symbol -->
    <path d="M-12,-5 Q-6,-15 0,-5 Q6,-15 12,-5 Q8,5 0,8 Q-8,5 -12,-5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <text x="0" y="85" text-anchor="middle" fill="#4aa3ff" font-size="14" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="2">PLANNER</text>
  </g>

  <!-- CODER AGENT (center) -->
  <g transform="translate(600, 300)" filter="url(#agentGlow)">
    <circle r="65" fill="#0f172a" stroke="url(#coderGrad)" stroke-width="3"/>
    <circle r="45" fill="url(#coderGrad)" opacity="0.15"/>
    <circle r="25" fill="url(#coderGrad)" opacity="0.6"/>
    <circle r="10" fill="#ffffff" opacity="0.8"/>
    <!-- Code brackets symbol -->
    <path d="M-14,0 L-8,-10 L-8,10 L-14,0" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <path d="M14,0 L8,-10 L8,10 L14,0" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <line x1="-4" y1="-6" x2="4" y2="6" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="85" text-anchor="middle" fill="#00e5ff" font-size="14" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="2">CODER</text>
  </g>

  <!-- REVIEWER AGENT (right) -->
  <g transform="translate(1000, 300)" filter="url(#agentGlow)">
    <circle r="65" fill="#0f172a" stroke="url(#reviewerGrad)" stroke-width="3"/>
    <circle r="45" fill="url(#reviewerGrad)" opacity="0.15"/>
    <circle r="25" fill="url(#reviewerGrad)" opacity="0.6"/>
    <circle r="10" fill="#ffffff" opacity="0.8"/>
    <!-- Checkmark/eye symbol -->
    <path d="M-10,-2 L-3,8 L12,-8" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="85" text-anchor="middle" fill="#a855f7" font-size="14" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="2">REVIEWER</text>
  </g>

  <!-- Output app floating above -->
  <g transform="translate(600, 120)" filter="url(#softGlow)">
    <rect x="-70" y="-40" width="140" height="80" rx="12" fill="#0f172a" stroke="url(#coderGrad)" stroke-width="2" opacity="0.9"/>
    <rect x="-62" y="-32" width="124" height="64" rx="8" fill="#1e293b" opacity="0.5"/>
    <!-- Window chrome dots -->
    <circle cx="-52" cy="-26" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="-44" cy="-26" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="-36" cy="-26" r="3" fill="#22c55e" opacity="0.8"/>
    <!-- Mock UI lines -->
    <rect x="-52" y="-14" width="40" height="6" rx="2" fill="#4aa3ff" opacity="0.5"/>
    <rect x="-52" y="-2" width="60" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="-52" y="6" width="50" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="-52" y="14" width="70" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="0" y="-14" width="44" height="28" rx="4" fill="#00e5ff" opacity="0.15"/>
    <text x="0" y="58" text-anchor="middle" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" opacity="0.6" letter-spacing="1">PRODUCTION APP</text>
  </g>

  <!-- Step arrows below -->
  <g opacity="0.5">
    <polygon points="200,420 190,410 210,410" fill="#4aa3ff"/>
    <polygon points="600,420 590,410 610,410" fill="#00e5ff"/>
    <polygon points="1000,420 990,410 1010,410" fill="#a855f7"/>
  </g>
</svg>