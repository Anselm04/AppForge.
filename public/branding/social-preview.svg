<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="spBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4aa3ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="spCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="spGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="spSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#spBg)"/>

  <!-- Ambient glow -->
  <radialGradient id="spAmbient" cx="60%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#4aa3ff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#080c18" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#spAmbient)"/>

  <!-- Perspective grid (subtle) -->
  <g opacity="0.06" stroke="#4aa3ff" stroke-width="0.5">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="200" y1="630" x2="600" y2="0"/>
    <line x1="400" y1="630" x2="600" y2="0"/>
    <line x1="600" y1="630" x2="600" y2="0"/>
    <line x1="800" y1="630" x2="600" y2="0"/>
    <line x1="1000" y1="630" x2="600" y2="0"/>
  </g>

  <!-- Logo mark (left side, larger) -->
  <g transform="translate(260, 315) scale(1.6)" filter="url(#spGlow)">
    <g stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-45" x2="-38" y2="28" stroke="url(#spBlue)"/>
      <line x1="0" y1="-45" x2="38" y2="28" stroke="url(#spCyan)"/>
      <line x1="-38" y1="28" x2="38" y2="28" stroke="#94a3b8"/>
    </g>
    <circle cx="0" cy="-45" r="18" fill="#0f172a" stroke="url(#spBlue)" stroke-width="2.5"/>
    <circle cx="0" cy="-45" r="9" fill="url(#spBlue)" opacity="0.85"/>
    <circle cx="0" cy="-45" r="4" fill="#ffffff" opacity="0.7"/>

    <circle cx="-38" cy="28" r="18" fill="#0f172a" stroke="url(#spCyan)" stroke-width="2.5"/>
    <circle cx="-38" cy="28" r="9" fill="url(#spCyan)" opacity="0.85"/>
    <circle cx="-38" cy="28" r="4" fill="#ffffff" opacity="0.7"/>

    <circle cx="38" cy="28" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="38" cy="28" r="9" fill="#94a3b8" opacity="0.85"/>
    <circle cx="38" cy="28" r="4" fill="#ffffff" opacity="0.7"/>

    <!-- Orbital arcs -->
    <path d="M0,15 A60,60 0 0,1 52,75" fill="none" stroke="#4aa3ff" stroke-width="1" opacity="0.35" stroke-dasharray="3 5"/>
    <path d="M-52,75 A60,60 0 0,1 0,135" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.35" stroke-dasharray="3 5"/>
  </g>

  <!-- Wordmark (right of logo) -->
  <text x="520" y="290" fill="#e2e8f0" font-size="64" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-2">App</text>
  <text x="670" y="290" fill="#4aa3ff" font-size="64" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-2">Forge</text>

  <!-- Accent underline -->
  <rect x="520" y="305" width="290" height="4" rx="2" fill="url(#spBlue)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="520" y="360" fill="#94a3b8" font-size="22" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="400" letter-spacing="1">BUILD FULL-STACK APPS WITH AI</text>

  <!-- Feature pills -->
  <g transform="translate(520, 395)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#4aa3ff" stroke-width="1" opacity="0.8"/>
    <text x="55" y="18" text-anchor="middle" fill="#4aa3ff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Multi-Agent</text>
  </g>
  <g transform="translate(640, 395)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e293b" stroke="#00e5ff" stroke-width="1" opacity="0.8"/>
    <text x="50" y="18" text-anchor="middle" fill="#00e5ff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Auto-Deploy</text>
  </g>
  <g transform="translate(750, 395)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
    <text x="45" y="18" text-anchor="middle" fill="#a855f7" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Billing</text>
  </g>

  <!-- Floating particles (right side) -->
  <g fill="url(#spBlue)" opacity="0.5">
    <circle cx="980" cy="180" r="3"/>
    <circle cx="1050" cy="220" r="2.5"/>
    <circle cx="1100" cy="160" r="4"/>
    <circle cx="1020" cy="280" r="2"/>
    <circle cx="1080" cy="320" r="3"/>
    <circle cx="1150" cy="260" r="2.5"/>
    <circle cx="1120" cy="400" r="3"/>
    <circle cx="1060" cy="450" r="2"/>
    <circle cx="1140" cy="480" r="3.5"/>
  </g>

  <!-- Bottom gradient fade -->
  <linearGradient id="spFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a0e1a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.8"/>
  </linearGradient>
  <rect x="0" y="530" width="1200" height="100" fill="url(#spFade)"/>
</svg>