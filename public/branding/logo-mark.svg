<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa3ff"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background (transparent for versatility) -->
  <!-- Three interlocking hexagonal nodes forming a triangle = multi-agent collaboration -->

  <!-- Outer ring (subtle) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>

  <!-- Connection lines forming the triangle -->
  <g filter="url(#shadow)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="100" y1="55" x2="65" y2="115" stroke="url(#blueGrad)"/>
    <line x1="100" y1="55" x2="135" y2="115" stroke="url(#cyanGrad)"/>
    <line x1="65" y1="115" x2="135" y2="115" stroke="url(#metalGrad)"/>
  </g>

  <!-- Three agent nodes -->
  <g filter="url(#logoGlow)">
    <!-- Top node - Planner (Blue) -->
    <circle cx="100" cy="55" r="22" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="3"/>
    <circle cx="100" cy="55" r="12" fill="url(#blueGrad)" opacity="0.9"/>
    <circle cx="100" cy="55" r="5" fill="#ffffff" opacity="0.6"/>

    <!-- Bottom-left node - Coder (Cyan) -->
    <circle cx="65" cy="115" r="22" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3"/>
    <circle cx="65" cy="115" r="12" fill="url(#cyanGrad)" opacity="0.9"/>
    <circle cx="65" cy="115" r="5" fill="#ffffff" opacity="0.6"/>

    <!-- Bottom-right node - Reviewer (Silver) -->
    <circle cx="135" cy="115" r="22" fill="#0f172a" stroke="url(#metalGrad)" stroke-width="3"/>
    <circle cx="135" cy="115" r="12" fill="url(#metalGrad)" opacity="0.9"/>
    <circle cx="135" cy="115" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Orbital arcs showing continuous flow -->
  <path d="M100,30 A70,70 0 0,1 160,100" fill="none" stroke="#4aa3ff" stroke-width="1" opacity="0.4" stroke-dasharray="4 6"/>
  <path d="M160,100 A70,70 0 0,1 100,170" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4" stroke-dasharray="4 6"/>
  <path d="M100,170 A70,70 0 0,1 40,100" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.4" stroke-dasharray="4 6"/>
</svg>