<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img" aria-label="AppForge metallic anvil A logo">
  <defs>
    <linearGradient id="goldOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c1"/>
      <stop offset=".18" stop-color="#d8b263"/>
      <stop offset=".48" stop-color="#9a7130"/>
      <stop offset=".72" stop-color="#e2c27a"/>
      <stop offset="1" stop-color="#7b5722"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d9"/>
      <stop offset=".36" stop-color="#c69a47"/>
      <stop offset=".72" stop-color="#8b6225"/>
      <stop offset="1" stop-color="#e0bd6c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset=".16" stop-color="#cfd0cd"/>
      <stop offset=".36" stop-color="#7d7e7a"/>
      <stop offset=".52" stop-color="#e8e8e5"/>
      <stop offset=".69" stop-color="#7b7a76"/>
      <stop offset="1" stop-color="#363633"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#444441"/>
      <stop offset=".28" stop-color="#d5d5d1"/>
      <stop offset=".52" stop-color="#747571"/>
      <stop offset=".76" stop-color="#efefec"/>
      <stop offset="1" stop-color="#343431"/>
    </linearGradient>
    <linearGradient id="innerWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c37a"/>
      <stop offset=".5" stop-color="#9a6e2b"/>
      <stop offset="1" stop-color="#f0d18c"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5d4a2b" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="anvilShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- outer gold A -->
    <path d="M180 25 L335 350 L281 350 L238 258 L122 258 L79 350 L25 350 Z"
          fill="url(#goldOuter)" stroke="#7c5928" stroke-width="3"/>
    <!-- recessed silver A face -->
    <path d="M180 53 L304 326 L280 326 L229 219 L131 219 L80 326 L56 326 Z"
          fill="url(#steel)" stroke="#b89a61" stroke-width="4"/>
    <!-- dark channel -->
    <path d="M180 79 L272 292 L249 292 L213 207 L147 207 L111 292 L88 292 Z"
          fill="#575752" opacity=".68"/>
    <!-- inner gold A -->
    <path d="M180 96 L252 286 L229 286 L203 214 L157 214 L131 286 L108 286 Z"
          fill="url(#innerWarm)" stroke="#59411e" stroke-width="2.5"/>
    <!-- inner black/silver aperture -->
    <path d="M180 120 L223 244 L202 244 L180 180 L158 244 L137 244 Z"
          fill="#343432" stroke="#d3d1c8" stroke-width="2"/>
  </g>

  <!-- circuit detailing -->
  <g fill="none" stroke="#d7b462" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity=".96">
    <path d="M119 127 L105 149 L105 183 L88 200"/>
    <path d="M131 145 L120 160 L120 192 L103 209"/>
    <path d="M145 165 L136 178 L136 205"/>
    <path d="M241 127 L255 149 L255 183 L272 200"/>
    <path d="M229 145 L240 160 L240 192 L257 209"/>
    <path d="M215 165 L224 178 L224 205"/>
  </g>
  <g fill="#e6c576" stroke="#5f4722" stroke-width="1">
    <circle cx="105" cy="149" r="3.2"/><circle cx="88" cy="200" r="3.2"/>
    <circle cx="120" cy="160" r="3.2"/><circle cx="103" cy="209" r="3.2"/>
    <circle cx="136" cy="178" r="3.2"/>
    <circle cx="255" cy="149" r="3.2"/><circle cx="272" cy="200" r="3.2"/>
    <circle cx="240" cy="160" r="3.2"/><circle cx="257" cy="209" r="3.2"/>
    <circle cx="224" cy="178" r="3.2"/>
  </g>

  <!-- anvil crossbar -->
  <g filter="url(#anvilShadow)">
    <!-- horn -->
    <path d="M25 207 C52 196 84 193 117 194 L117 224 C82 225 49 222 25 212 Z"
          fill="url(#steelDark)" stroke="#343431" stroke-width="2.5"/>
    <!-- working face -->
    <path d="M102 191 L326 191 L326 213 L102 213 Z"
          fill="url(#steelDark)" stroke="#343431" stroke-width="2.5"/>
    <path d="M105 191 L322 191 L318 196 L108 196 Z" fill="#f5f3ea" opacity=".72"/>
    <path d="M109 188 L324 188" stroke="url(#goldEdge)" stroke-width="4"/>

    <!-- anvil body -->
    <path d="M115 214 L267 214
             C263 233 252 249 235 261
             L226 284
             L134 284
             L125 261
             C108 249 97 233 93 214 Z"
          fill="url(#steel)" stroke="#343431" stroke-width="3"/>
    <!-- waist shadow -->
    <path d="M126 225 C141 245 145 255 144 267 L216 267 C215 255 219 245 234 225"
          fill="none" stroke="#5f605d" stroke-width="5" opacity=".65"/>
    <!-- base -->
    <path d="M119 278 L241 278 L257 304 L240 315 L217 299 L143 299 L120 315 L103 304 Z"
          fill="url(#steelDark)" stroke="#343431" stroke-width="3"/>
    <path d="M120 278 L240 278" stroke="#f1f0e9" stroke-width="3" opacity=".7"/>
  </g>

  <!-- fine metallic highlights -->
  <path d="M181 57 L293 315" stroke="#fff" stroke-width="2" opacity=".28"/>
  <path d="M67 319 L174 59" stroke="#fff" stroke-width="1.5" opacity=".28"/>
</svg>