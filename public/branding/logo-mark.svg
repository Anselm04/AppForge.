<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="AppForge anvil logo">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="18%" stop-color="#d3dae0"/>
      <stop offset="46%" stop-color="#9aa4ad"/>
      <stop offset="70%" stop-color="#69737c"/>
      <stop offset="100%" stop-color="#3a424a"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cfd7dd"/>
      <stop offset="100%" stop-color="#8b959e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e7b6"/>
      <stop offset="32%" stop-color="#d8b45e"/>
      <stop offset="64%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#7d5f1b"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2c8"/>
      <stop offset="100%" stop-color="#c6a24c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Gold "A" frame: two angled legs rising to an apex; the anvil is the crossbar -->
  <g filter="url(#soft)">
    <path d="M100 20 L134 92 L118 92 L100 52 L82 92 L66 92 Z" fill="url(#gold)"/>
    <path d="M62 150 L84 100 L100 100 L74 158 Z" fill="url(#gold)"/>
    <path d="M138 150 L116 100 L100 100 L126 158 Z" fill="url(#gold)"/>
    <!-- apex highlight -->
    <path d="M100 20 L108 37 L92 37 Z" fill="url(#goldEdge)" opacity="0.9"/>
  </g>

  <!-- Realistic steel anvil (acts as the A crossbar) -->
  <g filter="url(#soft)">
    <!-- Horn (left taper) -->
    <path d="M58 100 C40 100 26 106 20 112 C30 112 40 113 58 116 Z" fill="url(#steel)"/>
    <!-- Top face / working surface + heel -->
    <path d="M56 98 L150 98 L150 108 L150 116 L138 116 L138 110 L56 110 Z" fill="url(#steel)"/>
    <rect x="56" y="97" width="94" height="6" rx="2" fill="url(#steelTop)"/>
    <!-- Gold trim line along the working edge -->
    <rect x="56" y="96" width="94" height="2.4" rx="1.2" fill="url(#goldEdge)" opacity="0.85"/>
    <!-- Waist / pedestal (concave) -->
    <path d="M78 116 L122 116 C118 128 116 132 112 140 L88 140 C84 132 82 128 78 116 Z" fill="url(#steel)"/>
    <!-- Base with feet -->
    <path d="M62 140 L138 140 L146 158 L138 162 L124 154 L76 154 L62 162 L54 158 Z" fill="url(#steel)"/>
    <!-- Body sheen -->
    <path d="M60 100 L120 100 L118 108 L60 108 Z" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
