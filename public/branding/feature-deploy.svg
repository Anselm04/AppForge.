<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="depBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="depGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rocketGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#depBg)"/>

  <!-- Server infrastructure (bottom) -->
  <g transform="translate(600, 480)" filter="url(#depGlow)">
    <!-- Server rack 1 -->
    <rect x="-180" y="-60" width="100" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="-175" y="-52" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-170" cy="-48" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="-175" y="-38" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-170" cy="-34" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="-175" y="-24" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-170" cy="-20" r="2" fill="#ef4444" opacity="0.6"/>
    <rect x="-175" y="-10" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-170" cy="-6" r="2" fill="#22c55e" opacity="0.8"/>

    <!-- Server rack 2 -->
    <rect x="-40" y="-60" width="100" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="-35" y="-52" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-30" cy="-48" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="-35" y="-38" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-30" cy="-34" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="-35" y="-24" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-30" cy="-20" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="-35" y="-10" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="-30" cy="-6" r="2" fill="#22c55e" opacity="0.8"/>

    <!-- Server rack 3 -->
    <rect x="100" y="-60" width="100" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="105" y="-52" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="110" cy="-48" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="105" y="-38" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="110" cy="-34" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="105" y="-24" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="110" cy="-20" r="2" fill="#22c55e" opacity="0.8"/>
    <rect x="105" y="-10" width="90" height="8" rx="2" fill="#1e293b"/>
    <circle cx="110" cy="-6" r="2" fill="#22c55e" opacity="0.8"/>
  </g>

  <!-- Data streams flowing upward -->
  <g stroke-width="2" fill="none" opacity="0.5">
    <path d="M500,420 Q520,350 560,280" stroke="url(#tealGrad)"/>
    <path d="M600,420 Q600,340 600,260" stroke="url(#skyGrad)"/>
    <path d="M700,420 Q680,350 640,280" stroke="url(#tealGrad)"/>
  </g>

  <!-- Speed particles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="540" cy="350" r="3"/>
    <circle cx="600" cy="320" r="4"/>
    <circle cx="660" cy="340" r="3"/>
    <circle cx="580" cy="290" r="2"/>
    <circle cx="620" cy="270" r="3"/>
  </g>

  <!-- Floating browser window (finished app) -->
  <g transform="translate(600, 180)" filter="url(#rocketGlow)">
    <!-- Window frame -->
    <rect x="-120" y="-70" width="240" height="140" rx="14" fill="#0f172a" stroke="url(#tealGrad)" stroke-width="2.5" opacity="0.95"/>
    <!-- Title bar -->
    <rect x="-120" y="-70" width="240" height="22" rx="14" fill="#1e293b" opacity="0.6"/>
    <rect x="-120" y="-58" width="240" height="10" fill="#1e293b" opacity="0.6"/>
    <!-- Chrome dots -->
    <circle cx="-102" cy="-59" r="4" fill="#ef4444" opacity="0.85"/>
    <circle cx="-88" cy="-59" r="4" fill="#f59e0b" opacity="0.85"/>
    <circle cx="-74" cy="-59" r="4" fill="#22c55e" opacity="0.85"/>
    <!-- Content mock -->
    <rect x="-100" y="-28" width="60" height="10" rx="3" fill="#38bdf8" opacity="0.5"/>
    <rect x="-100" y="-12" width="80" height="6" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="-100" y="0" width="70" height="6" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="-100" y="12" width="90" height="6" rx="2" fill="#ffffff" opacity="0.2"/>
    <rect x="-100" y="24" width="50" height="6" rx="2" fill="#ffffff" opacity="0.2"/>
    <!-- Side card -->
    <rect x="0" y="-28" width="90" height="50" rx="6" fill="#14b8a6" opacity="0.12"/>
    <rect x="6" y="-20" width="78" height="6" rx="2" fill="#14b8a6" opacity="0.4"/>
    <rect x="6" y="-8" width="60" height="4" rx="1" fill="#ffffff" opacity="0.2"/>
    <rect x="6" y="0" width="50" height="4" rx="1" fill="#ffffff" opacity="0.15"/>
    <rect x="6" y="8" width="70" height="4" rx="1" fill="#ffffff" opacity="0.15"/>
    <!-- Deployed badge -->
    <g transform="translate(0, 55)">
      <rect x="-40" y="-8" width="80" height="16" rx="8" fill="#0d9488" opacity="0.9"/>
      <text x="0" y="3" text-anchor="middle" fill="#ffffff" font-size="9" font-family="system-ui, sans-serif" font-weight="600" letter-spacing="1">LIVE</text>
    </g>
  </g>

  <!-- Rocket boost effect -->
  <g transform="translate(600, 300)" opacity="0.3">
    <path d="M-8,0 L-12,30 L-4,25 L0,40 L4,25 L12,30 L8,0" fill="url(#skyGrad)"/>
  </g>
</svg>