<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cyanGradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <filter id="shieldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#secBg)"/>

  <!-- Radiating light rays from shield -->
  <g opacity="0.08" stroke="url(#amberGrad)" stroke-width="1">
    <line x1="600" y1="300" x2="200" y2="100"/>
    <line x1="600" y1="300" x2="100" y2="300"/>
    <line x1="600" y1="300" x2="200" y2="500"/>
    <line x1="600" y1="300" x2="600" y2="580"/>
    <line x1="600" y1="300" x2="1000" y2="500"/>
    <line x1="600" y1="300" x2="1100" y2="300"/>
    <line x1="600" y1="300" x2="1000" y2="100"/>
    <line x1="600" y1="300" x2="600" y2="20"/>
  </g>

  <!-- Floating lock icons -->
  <g filter="url(#lockGlow)" opacity="0.7">
    <!-- Lock 1 -->
    <g transform="translate(250, 200)">
      <rect x="-12" y="-6" width="24" height="20" rx="3" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <path d="M-8,-6 L-8,-14 A8,8 0 0,1 8,-14 L8,-6" fill="none" stroke="#00e5ff" stroke-width="2"/>
      <circle cx="0" cy="4" r="3" fill="#00e5ff" opacity="0.6"/>
    </g>
    <!-- Lock 2 -->
    <g transform="translate(950, 220)">
      <rect x="-10" y="-5" width="20" height="16" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M-6,-5 L-6,-12 A6,6 0 0,1 6,-12 L6,-5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
    <!-- Lock 3 -->
    <g transform="translate(300, 420)" opacity="0.5">
      <rect x="-8" y="-4" width="16" height="12" rx="2" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <path d="M-5,-4 L-5,-10 A5,5 0 0,1 5,-10 L5,-4" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    </g>
    <!-- Lock 4 -->
    <g transform="translate(900, 400)" opacity="0.6">
      <rect x="-10" y="-5" width="20" height="16" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M-6,-5 L-6,-12 A6,6 0 0,1 6,-12 L6,-5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Audit log scrolls floating -->
  <g opacity="0.4" stroke="#00e5ff" stroke-width="1" fill="none">
    <g transform="translate(380, 160)">
      <rect x="-20" y="-30" width="40" height="60" rx="3"/>
      <line x1="-14" y1="-20" x2="14" y2="-20"/>
      <line x1="-14" y1="-10" x2="10" y2="-10"/>
      <line x1="-14" y1="0" x2="12" y2="0"/>
      <line x1="-14" y1="10" x2="8" y2="10"/>
      <line x1="-14" y1="20" x2="14" y2="20"/>
    </g>
    <g transform="translate(820, 440)" opacity="0.3">
      <rect x="-16" y="-24" width="32" height="48" rx="2"/>
      <line x1="-10" y1="-16" x2="10" y2="-16"/>
      <line x1="-10" y1="-6" x2="8" y2="-6"/>
      <line x1="-10" y1="4" x2="6" y2="4"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
    </g>
  </g>

  <!-- Central shield (crystalline translucent) -->
  <g transform="translate(600, 300)" filter="url(#shieldGlow)">
    <!-- Outer shield shape -->
    <path d="M0,-80 C-45,-60 -70,-20 -70,30 C-70,70 -35,100 0,110 C35,100 70,70 70,30 C70,-20 45,-60 0,-80"
          fill="#0f172a" stroke="url(#amberGrad)" stroke-width="3" opacity="0.9"/>
    <!-- Inner glow layer -->
    <path d="M0,-70 C-38,-52 -60,-18 -60,28 C-60,62 -30,88 0,96 C30,88 60,62 60,28 C60,-18 38,-52 0,-70"
          fill="url(#amberGrad)" opacity="0.12"/>
    <!-- Checkmark -->
    <path d="M-22,-8 L-8,12 L28,-24"
          fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Encrypted data stream rings around shield -->
  <g transform="translate(600, 300)" fill="none" opacity="0.3">
    <ellipse rx="140" ry="100" stroke="#00e5ff" stroke-width="1" stroke-dasharray="8 12"/>
    <ellipse rx="170" ry="120" stroke="#fbbf24" stroke-width="0.5" stroke-dasharray="6 18"/>
  </g>

  <!-- Data packets orbiting -->
  <g fill="#ffffff" opacity="0.5">
    <rect x="450" y="200" width="12" height="8" rx="2" fill="#00e5ff"/>
    <rect x="740" y="260" width="10" height="6" rx="2" fill="#fbbf24"/>
    <rect x="470" y="380" width="8" height="6" rx="2" fill="#00e5ff"/>
    <rect x="720" y="400" width="12" height="8" rx="2" fill="#fbbf24"/>
  </g>
</svg>