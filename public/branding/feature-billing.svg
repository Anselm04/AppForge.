<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="billBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="billCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#billBg)"/>

  <!-- Floating coins -->
  <g filter="url(#coinGlow)">
    <!-- Large coin 1 -->
    <g transform="translate(220, 200)">
      <circle r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
      <circle r="20" fill="url(#goldGrad)" opacity="0.2"/>
      <text x="0" y="6" text-anchor="middle" fill="#fbbf24" font-size="20" font-family="system-ui, sans-serif" font-weight="700">$</text>
    </g>
    <!-- Large coin 2 -->
    <g transform="translate(980, 240)">
      <circle r="24" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <circle r="17" fill="url(#goldGrad)" opacity="0.15"/>
      <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-size="16" font-family="system-ui, sans-serif" font-weight="700">$</text>
    </g>
    <!-- Small coin 3 -->
    <g transform="translate(280, 380)" opacity="0.7">
      <circle r="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle r="13" fill="url(#goldGrad)" opacity="0.1"/>
      <text x="0" y="4" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="system-ui, sans-serif" font-weight="700">$</text>
    </g>
    <!-- Small coin 4 -->
    <g transform="translate(920, 400)" opacity="0.6">
      <circle r="16" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle r="11" fill="url(#goldGrad)" opacity="0.1"/>
      <text x="0" y="4" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="system-ui, sans-serif" font-weight="700">$</text>
    </g>
  </g>

  <!-- Credit meter bars -->
  <g transform="translate(360, 320)">
    <!-- Meter background -->
    <rect x="0" y="0" width="200" height="16" rx="8" fill="#1e293b" opacity="0.5"/>
    <!-- Meter fill (75%) -->
    <rect x="0" y="0" width="150" height="16" rx="8" fill="url(#meterGrad)" opacity="0.85"/>
    <!-- Glow overlay -->
    <rect x="0" y="0" width="150" height="16" rx="8" fill="#ffffff" opacity="0.1"/>
    <!-- Tick marks -->
    <line x1="50" y1="-4" x2="50" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <line x1="100" y1="-4" x2="100" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <line x1="150" y1="-4" x2="150" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <!-- Credit label -->
    <text x="100" y="36" text-anchor="middle" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" opacity="0.5" letter-spacing="1">CREDITS</text>
  </g>

  <!-- Second meter (smaller, bottom) -->
  <g transform="translate(400, 400)">
    <rect x="0" y="0" width="160" height="12" rx="6" fill="#1e293b" opacity="0.4"/>
    <rect x="0" y="0" width="120" height="12" rx="6" fill="url(#billCyan)" opacity="0.7"/>
    <text x="80" y="28" text-anchor="middle" fill="#00e5ff" font-size="10" font-family="system-ui, sans-serif" opacity="0.5" letter-spacing="1">BUILD QUOTA</text>
  </g>

  <!-- Premium subscription card (center-right) -->
  <g transform="translate(800, 300)" filter="url(#cardGlow)">
    <!-- Card body -->
    <rect x="-90" y="-70" width="180" height="140" rx="16" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.95"/>
    <!-- Gold shimmer top bar -->
    <rect x="-90" y="-70" width="180" height="30" rx="16" fill="url(#goldGrad)" opacity="0.15"/>
    <rect x="-90" y="-55" width="180" height="15" fill="url(#goldGrad)" opacity="0.08"/>
    <!-- Crown icon -->
    <g transform="translate(0, -45)">
      <path d="M-12,5 L-6,-8 L0,-2 L6,-8 L12,5 L8,8 L-8,8 Z" fill="url(#goldGrad)" opacity="0.9"/>
      <circle cx="-6" cy="-6" r="2" fill="#fbbf24"/>
      <circle cx="6" cy="-6" r="2" fill="#fbbf24"/>
      <circle cx="0" cy="-3" r="2.5" fill="#fbbf24"/>
    </g>
    <!-- Tier label -->
    <text x="0" y="-15" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="2">BUILDER</text>
    <!-- Feature checkmarks -->
    <g transform="translate(0, 10)">
      <path d="M-55,0 L-50,5 L-40,-5" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="-30" y="3" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" opacity="0.6">66 builds/mo</text>
    </g>
    <g transform="translate(0, 28)">
      <path d="M-55,0 L-50,5 L-40,-5" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="-30" y="3" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" opacity="0.6">400 credits</text>
    </g>
    <g transform="translate(0, 46)">
      <path d="M-55,0 L-50,5 L-40,-5" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
      <text x="-30" y="3" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" opacity="0.6">Priority queue</text>
    </g>
    <!-- Price tag -->
    <g transform="translate(0, 68)">
      <rect x="-30" y="-8" width="60" height="16" rx="8" fill="#d97706" opacity="0.9"/>
      <text x="0" y="3" text-anchor="middle" fill="#ffffff" font-size="10" font-family="system-ui, sans-serif" font-weight="600">$149/mo</text>
    </g>
  </g>

  <!-- Connecting dotted lines -->
  <g stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" fill="none">
    <line x1="250" y1="220" x2="360" y2="328"/>
    <line x1="280" y1="380" x2="400" y2="406"/>
    <line x1="560" y1="336" x2="710" y2="300"/>
    <line x1="560" y1="412" x2="710" y2="370"/>
  </g>
</svg>