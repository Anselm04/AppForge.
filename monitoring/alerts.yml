groups:
  - name: appforge
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }} MB"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}%"


      - alert: BuildQueueBacklog
        expr: appforge_queue_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AppForge build queue backlog"
          description: "Build queue depth has exceeded 100 jobs for 5 minutes."

      - alert: RedisUnavailable
        expr: appforge_redis_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AppForge Redis unavailable"
          description: "Shared Redis is unavailable; distributed queue and rate-limit coordination may be degraded."

      - alert: DatabaseUnavailable
        expr: appforge_database_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AppForge database unavailable"
          description: "Database health probes are failing."

      - alert: BuildFailures
        expr: increase(appforge_builds_total{status="error"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repeated AppForge build failures"
          description: "More than five build failures were observed in the last 15 minutes."

      - alert: DeploymentFailures
        expr: increase(appforge_deployments_total{status="error"}[15m]) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Repeated AppForge deployment failures"
          description: "Production deployment verification has failed repeatedly."

      - alert: RateLimitPressure
        expr: sum(increase(appforge_rate_limit_rejections_total[10m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated rate-limit pressure"
          description: "AppForge is rejecting a high volume of requests at abuse-control boundaries."
