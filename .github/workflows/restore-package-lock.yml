name: restore-package-lock
on:
  workflow_dispatch:
  push:
    branches: [feat/posthog-sdk]
    paths: [.github/workflows/restore-package-lock.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate full package-lock.json
        run: |
          npm install --package-lock-only
          BYTES=$(wc -c < package-lock.json)
          echo lockfile_bytes=$BYTES
          test "$BYTES" -gt 100000
          grep -q posthog-js package-lock.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then echo no_change; exit 0; fi
          git commit -m "fix: restore full package-lock.json for posthog-js"
          git push
