name: Format Diff Debug

on:
  push:
    branches:
      - fix/launch-cert-evidence-truth

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show Prettier diff for MFA contract
        run: |
          npx prettier --write src/lib/__tests__/adminMfaSecurityContract.test.ts
          git diff -- src/lib/__tests__/adminMfaSecurityContract.test.ts
