name: Validate Flutter push deep-link support
on:
  push:
    branches: [feat/flutter-push-deeplink-support]
    paths:
      - ".github/workflows/validate-flutter-push-deeplink.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/flutter-push-deeplink-support
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run src/lib/__tests__/flutterNativeCapabilitySupport.test.ts
      - run: npx prettier --check src/services/flutterNativeCapabilitySupport.ts src/lib/__tests__/flutterNativeCapabilitySupport.test.ts src/lib/codeGeneration.ts
