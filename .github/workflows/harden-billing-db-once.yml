name: Harden billing database once

on:
  push:
    paths:
      - '.github/workflows/harden-billing-db-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply guarded database hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          # Drizzle schema: declare Stripe transaction reference unique.
          path = Path('src/db/schema.ts')
          text = path.read_text()
          old = '''    index("credit_tx_project_idx").on(table.projectId),\n  ],\n);'''
          new = '''    index("credit_tx_project_idx").on(table.projectId),\n    uniqueIndex("credit_tx_stripe_ref_unique").on(table.stripePaymentIntentId),\n  ],\n);'''
          if old not in text:
              raise SystemExit('credit transaction index block not found')
          text = text.replace(old, new, 1)
          old_import = '''  integer,\n  index,\n} from "drizzle-orm/pg-core";'''
          new_import = '''  integer,\n  index,\n  uniqueIndex,\n} from "drizzle-orm/pg-core";'''
          if old_import not in text:
              raise SystemExit('schema import block not found')
          text = text.replace(old_import, new_import, 1)
          path.write_text(text)

          # Fly bootstrap schema: enforce the same DB uniqueness.
          path = Path('src/db/ensureSchema.ts')
          text = path.read_text()
          marker = '''CREATE INDEX IF NOT EXISTS "credit_tx_project_idx" ON "credit_transactions" ("project_id");'''
          replacement = marker + '''\nCREATE UNIQUE INDEX IF NOT EXISTS "credit_tx_stripe_ref_unique" ON "credit_transactions" ("stripe_payment_intent_id");'''
          if marker not in text:
              raise SystemExit('ensureSchema credit index marker not found')
          text = text.replace(marker, replacement, 1)
          old_missing = '''  if (!ENV.databaseUrl) {\n    console.warn("Skipping schema ensure: DATABASE_URL is not set");\n    return;\n  }'''
          new_missing = '''  if (!ENV.databaseUrl) {\n    if (ENV.isProduction) {\n      throw new Error("DATABASE_URL is required in production");\n    }\n    console.warn("Skipping schema ensure: DATABASE_URL is not set");\n    return;\n  }'''
          if old_missing not in text:
              raise SystemExit('ensureSchema missing DB guard not found')
          text = text.replace(old_missing, new_missing, 1)
          path.write_text(text)

          # Credit service: short-circuit Stripe replays before changing balance.
          path = Path('src/db.ts')
          text = path.read_text()
          old = '''export async function addCredits(\n  userId: number,\n  amount: number,\n  type: string,\n  description?: string,\n  stripePaymentIntentId?: string,\n) {\n  const credits = await getUserCredits(userId);\n  const currentBalance = credits?.balance ?? 0;'''
          new = '''export async function addCredits(\n  userId: number,\n  amount: number,\n  type: string,\n  description?: string,\n  stripePaymentIntentId?: string,\n) {\n  const credits = await getUserCredits(userId);\n  const currentBalance = credits?.balance ?? 0;\n\n  if (stripePaymentIntentId) {\n    const existing = await db.query.creditTransactions.findFirst({\n      where: eq(\n        schema.creditTransactions.stripePaymentIntentId,\n        stripePaymentIntentId,\n      ),\n    });\n    if (existing) {\n      await unpauseCreditExhaustedProjects(userId);\n      return currentBalance;\n    }\n  }'''
          if old not in text:
              raise SystemExit('addCredits block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Production must not continue after schema initialization failure.
          path = Path('src/server.ts')
          text = path.read_text()
          old = '''  try {\n    await ensureAppSchema();\n  } catch (err) {\n    console.error("Schema ensure failed:", err);\n  }'''
          new = '''  try {\n    await ensureAppSchema();\n  } catch (err) {\n    console.error("Schema ensure failed:", err);\n    if (ENV.isProduction) throw err;\n  }'''
          if old not in text:
              raise SystemExit('server schema ensure block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format and validate changed files
        run: |
          npx prettier --write src/db/schema.ts src/db/ensureSchema.ts src/db.ts src/server.ts
          npm run typecheck
          npm run lint
      - name: Commit guarded hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db/schema.ts src/db/ensureSchema.ts src/db.ts src/server.ts
          git diff --cached --quiet || git commit -m 'fix(billing): make credit grants idempotent and DB startup fail closed'
          git pull --rebase origin main
          git push
