name: Refresh security lockfile once

on:
  push:
    paths:
      - '.github/workflows/security-lockfile-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh strict lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify install and production audit
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || git commit -m 'chore(deps): lock patched DOMPurify override'
          git pull --rebase origin main
          git push
