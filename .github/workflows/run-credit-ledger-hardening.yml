name: Run credit ledger hardening

on:
  push:
    paths:
      - '.github/credit-ledger.trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Execute reviewed hardening patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          yml = Path('.github/workflows/harden-credit-ledger-once.yml').read_text()
          marker = "python3 - <<'PY'\n"
          block = yml.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(block), {})
          PY
      - run: npx prettier --write src/db.ts
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Commit hardened ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.ts
          git diff --cached --quiet || git commit -m 'security: serialize credit ledger mutations'
          git push
