name: Run credit ledger hardening

on:
  push:
    paths:
      - '.github/credit-ledger.trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Execute reviewed hardening patch
        run: python3 .github/scripts/harden_credit_ledger.py
      - run: npx prettier --write src/db.ts src/webhooks/stripe.ts
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Commit hardened revenue path
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.ts src/webhooks/stripe.ts
          git diff --cached --quiet || git commit -m 'security: harden credit refills and Stripe tier mapping'
          git pull --rebase origin main
          git push origin main
