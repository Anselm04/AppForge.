name: Production Customer Flow Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: production-customer-flow-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live customer entry flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production health and customer routes
        shell: bash
        run: |
          set -euo pipefail
          URL="https://appforge-unfurling-moon-9058.fly.dev"

          # Fly blue/green replacement and two-Machine routing can produce a brief
          # connection-level miss while the proxy converges. Retry transport/5xx
          # failures, but never turn an application-level 4xx into a false green.
          curl_success() {
            endpoint="$1"
            for attempt in $(seq 1 6); do
              status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
                --output /dev/null --write-out '%{http_code}' "$URL$endpoint" || true)
              if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 400 ] 2>/dev/null; then
                return 0
              fi
              echo "Transient check for $endpoint returned ${status:-transport-error} (attempt $attempt/6)"
              sleep $((attempt * 2))
            done
            echo "Production endpoint $endpoint did not become healthy after retries"
            return 1
          }

          curl_success "/api/health/live"
          curl_success "/api/health/ready"

          check_page() {
            route="$1"
            body="$(mktemp)"
            for attempt in $(seq 1 6); do
              status=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --location \
                --output "$body" --write-out '%{http_code}' "$URL$route" || true)
              if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 400 ] 2>/dev/null && [ -s "$body" ] && grep -q 'id="root"' "$body"; then
                rm -f "$body"
                return 0
              fi
              if [ "$status" -ge 400 ] 2>/dev/null && [ "$status" -lt 500 ] 2>/dev/null; then
                echo "Customer route $route returned non-transient HTTP $status"
                cat "$body" || true
                rm -f "$body"
                return 1
              fi
              echo "Customer route $route not ready (${status:-transport-error}, attempt $attempt/6)"
              : > "$body"
              sleep $((attempt * 2))
            done
            echo "Customer route $route did not become healthy after retries"
            cat "$body" || true
            rm -f "$body"
            return 1
          }

          check_page "/"
          check_page "/signup"
          check_page "/signup?next=/pricing"
          check_page "/login"
          check_page "/login?next=%2Fpricing"
          check_page "/pricing"
          check_page "/redeem"

          assert_status() {
            expected="$1"
            endpoint="$2"
            for attempt in $(seq 1 4); do
              actual=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
                --output /dev/null --write-out '%{http_code}' "$URL$endpoint" || true)
              if [ "$actual" = "$expected" ]; then
                return 0
              fi
              # A real application response that differs from the security contract
              # is not transient and must remain red.
              if [ "$actual" -ge 400 ] 2>/dev/null && [ "$actual" -lt 500 ] 2>/dev/null; then
                echo "Expected $endpoint to return HTTP $expected anonymously, got $actual"
                return 1
              fi
              echo "Auth-boundary check for $endpoint returned ${actual:-transport-error} (attempt $attempt/4)"
              sleep $((attempt * 2))
            done
            echo "Expected $endpoint to return HTTP $expected anonymously after retries, got ${actual:-transport-error}"
            return 1
          }

          # Every customer-private REST surface must fail closed before route
          # handlers execute. These checks run continuously against production so
          # a future routing change cannot silently reopen an anonymous boundary.
          assert_status 401 "/api/preview-auth/1"
          assert_status 401 "/api/build/1"
          assert_status 401 "/api/ai"
          assert_status 401 "/api/agents"
          assert_status 401 "/api/generate"
          assert_status 401 "/api/checkout"
          assert_status 401 "/api/apps"
          assert_status 401 "/api/billing"

          echo "Scheduled two-Machine production customer-flow and auth-boundary smoke passed"
