name: One-time AppForge draft formatting
on:
  push:
    branches: [fix/appforge-offline-production-gates-integrated-20261106]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Anselm04/AppForge.'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Install locked formatter without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format changed TypeScript files in draft only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' \
            | xargs -0 -r npx prettier --write --ignore-unknown
          git add -u -- src
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style: format AppForge release candidate sources'
          git push origin HEAD:fix/appforge-offline-production-gates-integrated-20261106
