name: One-shot E2E Format Probe
on:
  push:
    branches:
      - strengthen/e2e-build-test-deploy-proof
permissions:
  contents: read
jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show pinned Prettier result
        run: |
          npx prettier --write src/__tests__/golden-path.e2e.spec.ts
          git diff -- src/__tests__/golden-path.e2e.spec.ts
