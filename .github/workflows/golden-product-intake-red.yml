name: Golden Product intake regression
on:
  push:
    branches: [feat/golden-product-normal-pipeline]
    paths:
      - ".github/workflows/golden-product-intake-red.yml"
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/golden-product-normal-pipeline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run src/lib/__tests__/goldenProductPipeline.test.ts
