name: Format Flutter push deep-link support
on:
  push:
    branches: [feat/flutter-push-deeplink-support]
    paths:
      - ".github/workflows/format-flutter-push-deeplink.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/flutter-push-deeplink-support
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/services/flutterNativeCapabilitySupport.ts src/lib/__tests__/flutterNativeCapabilitySupport.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/services/flutterNativeCapabilitySupport.ts src/lib/__tests__/flutterNativeCapabilitySupport.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/flutterNativeCapabilitySupport.ts src/lib/__tests__/flutterNativeCapabilitySupport.test.ts
          git commit -m "Format Flutter push deep-link support"
          git push origin HEAD:feat/flutter-push-deeplink-support
