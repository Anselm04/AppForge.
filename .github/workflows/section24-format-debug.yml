name: Section 24 Format Debug

on:
  push:
    branches:
      - fix/section-24-recovery-rollback

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx prettier --write             src/__tests__/section24RecoveryRollback.test.ts             src/routers/projects.ts             src/services/recovery.ts
          git diff --             src/__tests__/section24RecoveryRollback.test.ts             src/routers/projects.ts             src/services/recovery.ts
