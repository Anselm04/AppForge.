name: Verify customer email-only authentication repair (offline)
on:
  push:
    paths:
      - '.github/workflows/verify-customer-email-auth-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      CI: "true"
      STRIPE_SECRET_KEY: ""
      FLY_API_TOKEN: ""
      TWILIO_AUTH_TOKEN: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without running install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assemble offline source pipeline
        run: npm run assemble:pipeline
      - name: Run offline customer / owner auth regression tests
        run: |
          npx vitest run --maxWorkers=2 \
            src/__tests__/authLifecycleComplete.contract.test.ts \
            src/__tests__/authProviderRoles.contract.test.ts \
            src/__tests__/customer-flow-contract.e2e.spec.ts \
            src/__tests__/authEmailDelivery.test.ts \
            src/__tests__/authEmailLinks.test.ts \
            src/__tests__/authResend.test.ts \
            src/middleware/requireAuthenticatedUser.test.ts \
            src/__tests__/accountCredentials.test.ts \
            src/pages/__tests__/VerifyPhone.test.tsx
      - name: Offline TypeScript verification
        run: npm run typecheck
