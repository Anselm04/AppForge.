name: Prettier Recovery Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/__tests__/buildQueueBillingSemantics.test.ts
          git diff --no-color -- src/__tests__/buildQueueBillingSemantics.test.ts
