name: Recovery Readiness Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/DISASTER_RECOVERY.md'
      - 'docs/OFFSITE_BACKUP.md'
      - 'docs/OWNER_BREAK_GLASS.md'
      - 'docs/RECOVERY_INVENTORY.md'
      - 'docs/PLATINUM_SECURITY_PROTOCOL.md'
      - 'scripts/recovery-governance.sh'
      - 'fly.toml'
      - 'src/middleware/rateLimiter.ts'
      - 'src/routes/health.ts'
      - 'src/services/build-queue.ts'
      - 'src/services/vantaSync.ts'
      - 'src/utils/env-validator.ts'
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-readiness
  cancel-in-progress: false

jobs:
  audit:
    name: Verify recovery control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require recovery control files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/DISASTER_RECOVERY.md
            docs/OFFSITE_BACKUP.md
            docs/OWNER_BREAK_GLASS.md
            docs/RECOVERY_INVENTORY.md
            docs/PLATINUM_SECURITY_PROTOCOL.md
            scripts/recovery-governance.sh
            .github/workflows/repository-backup.yml
            .github/workflows/repository-metadata-backup.yml
            .github/workflows/security.yml
            .github/workflows/deploy-production.yml
            .github/workflows/fly-capacity-guard.yml
            .github/workflows/production-customer-flow-smoke.yml
            src/middleware/rateLimiter.ts
            src/routes/health.ts
            src/services/build-queue.ts
            src/services/vantaSync.ts
            src/utils/env-validator.ts
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing recovery control: $file"; exit 1; }
          done

      - name: Verify owner recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'No single password, phone, device, provider, GitHub account, or encryption key may be the only recovery path.' docs/OWNER_BREAK_GLASS.md
          grep -Fq 'At least two independent recovery methods must exist for the owner.' docs/OWNER_BREAK_GLASS.md
          grep -Fq 'Never store recovery codes or private keys here.' docs/RECOVERY_INVENTORY.md
          grep -Fq 'OFFSITE_BACKUP_PASSPHRASE' docs/RECOVERY_INVENTORY.md
          grep -Fq 'known-good production' docs/OWNER_BREAK_GLASS.md

      - name: Verify platinum owner-safety invariants
        shell: bash
        run: |
          set -euo pipefail
          file=docs/PLATINUM_SECURITY_PROTOCOL.md
          grep -Fq 'never create a single point of lockout' "$file"
          grep -Fq 'Maintain two independent recovery kits.' "$file"
          grep -Fq 'AI systems and automation are treated as untrusted change producers.' "$file"
          grep -Fq 'The off-site backup decryption passphrase must exist outside GitHub.' "$file"
          grep -Fq 'At least quarterly, conduct a full owner-access disaster simulation' "$file"
          grep -Fq 'A security control that the legitimate owner cannot recover from is a failed security control.' "$file"

      - name: Verify repository backup invariants
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/repository-backup.yml
          grep -Fq 'permissions:' "$file"
          grep -Fq 'contents: read' "$file"
          grep -Fq 'persist-credentials: false' "$file"
          grep -Fq 'git fsck --full --strict' "$file"
          grep -Fq 'git bundle create' "$file"
          grep -Fq 'git bundle verify' "$file"
          grep -Fq 'sha256sum' "$file"
          grep -Fq 'hmac' "$file"
          grep -Fq 'aes-256-cbc' "$file"
          grep -Fq 'OFFSITE_1_BUCKET' "$file"
          grep -Fq 'OFFSITE_2_BUCKET' "$file"
          grep -Fq 'workflow_dispatch:' "$file"
          grep -Fq 'schedule:' "$file"

      - name: Verify metadata backup is isolated from pull-request execution
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/repository-metadata-backup.yml
          grep -Fq 'contents: read' "$file"
          grep -Fq 'issues: read' "$file"
          grep -Fq 'pull-requests: read' "$file"
          if grep -Eq '^[[:space:]]+pull_request:' "$file"; then
            echo 'Repository metadata backup must not run directly on pull_request events.'
            exit 1
          fi

      - name: Verify production remains gated by successful CI
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/deploy-production.yml
          grep -Fq 'workflow_run:' "$file"
          grep -Fq 'workflows: ["CI Pipeline"]' "$file"
          grep -Fq "github.event.workflow_run.conclusion == 'success'" "$file"
          grep -Fq 'github.event.workflow_run.head_sha' "$file"

      - name: Verify exact two-machine production recovery contract
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq "^[[:space:]]*strategy[[:space:]]*=[[:space:]]*'bluegreen'" fly.toml
          grep -Eq "^[[:space:]]*auto_stop_machines[[:space:]]*=[[:space:]]*false" fly.toml
          grep -Eq "^[[:space:]]*auto_start_machines[[:space:]]*=[[:space:]]*true" fly.toml
          grep -Eq "^[[:space:]]*min_machines_running[[:space:]]*=[[:space:]]*2" fly.toml
          grep -Eq "^[[:space:]]*path[[:space:]]*=[[:space:]]*'/api/health/live'" fly.toml

          deploy=.github/workflows/deploy-production.yml
          guard=.github/workflows/fly-capacity-guard.yml
          smoke=.github/workflows/production-customer-flow-smoke.yml
          inventory=docs/RECOVERY_INVENTORY.md
          runbook=docs/DISASTER_RECOVERY.md

          grep -Fq 'flyctl scale count 2 --process-group app' "$deploy"
          grep -Fq 'expected exactly two started app Machines' "$deploy"
          grep -Fq 'flyctl scale count 2 --process-group app' "$guard"
          grep -Fq 'Exactly two started Fly app Machines established.' "$guard"
          grep -Fq 'needed=$((2 - started))' "$guard"
          grep -Fq 'head -n "$needed"' "$guard"

          # Shared state is a correctness dependency for the redundant fleet.
          grep -Fq 'REDIS_URL' "$deploy"
          grep -Fq 'REDIS_URL is required in production for shared multi-machine coordination' src/utils/env-validator.ts
          grep -Fq 'createDistributedStore' src/middleware/rateLimiter.ts
          grep -Fq 'checkSharedRedis' src/routes/health.ts
          grep -Fq 'BullMQ/Redis configuration needed for distributed builds' "$inventory"

          # Recurring side effects started by both processes must elect one writer.
          grep -Fq 'claimVantaHeartbeatSlot' src/services/vantaSync.ts
          grep -Fq 'appforge:vanta:heartbeat:' src/services/vantaSync.ts
          grep -Fq 'NX: true' src/services/vantaSync.ts
          grep -Fq 'single-writer' "$inventory"

          if grep -Fq 'starts any non-started app Machine' "$inventory"; then
            echo 'Recovery inventory still describes the obsolete over-start behavior.'
            exit 1
          fi

          grep -Fq 'two-Machine routing can produce a brief' "$smoke"
          grep -Fq 'non-transient HTTP' "$smoke"
          grep -Fq 'Scheduled two-Machine production customer-flow and auth-boundary smoke passed' "$smoke"

          grep -Fq 'exactly two started app Machines' "$runbook"
          grep -Fq 'Fly Production Capacity Guard' "$runbook"
          grep -Fq 'shared Redis' "$runbook"
          grep -Fq 'single-writer' "$runbook"

      - name: Verify recovery governance recognizes platinum controls
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'docs/OWNER_BREAK_GLASS' scripts/recovery-governance.sh
          grep -Fq 'docs/RECOVERY_INVENTORY' scripts/recovery-governance.sh
          grep -Fq 'docs/PLATINUM_SECURITY_PROTOCOL' scripts/recovery-governance.sh
          grep -Fq 'recovery-readiness' scripts/recovery-governance.sh

      - name: Report GitHub main protection state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main")"
          protected="$(printf '%s' "$response" | jq -r '.protected')"
          echo "GitHub main protected: $protected"
          if [ "$protected" != 'true' ]; then
            echo '::warning::GitHub still reports main as unprotected. Enable the repository ruleset/branch protection to remove this remaining governance gap.'
          fi

      - name: Platinum recovery readiness summary
        shell: bash
        run: |
          echo 'Owner break-glass protocol present.'
          echo 'Recovery inventory present.'
          echo 'Platinum owner-safe security protocol present and structurally verified.'
          echo 'Repository and metadata backup controls structurally verified.'
          echo 'Production deploy remains bound to successful CI and exact SHA.'
          echo 'Exact two-Machine Fly recovery, shared Redis coordination, single-writer background side effects, capacity reconciliation, and resilient customer smoke controls are structurally verified.'
          echo 'Recovery governance remains active.'
