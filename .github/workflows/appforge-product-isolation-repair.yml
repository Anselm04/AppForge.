name: AppForge Product Isolation Repair

on:
  push:
    branches:
      - fix/appforge-product-isolation

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[isolation-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Apply deterministic isolation repair
        run: python3 scripts/repair-product-isolation.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Run test suite
        run: npm test -- --run

      - name: Verify no cross-product identity remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -in "trillion" -- . ':!scripts/repair-product-isolation.py'; then
            echo "Cross-product identity remains in AppForge"
            exit 1
          fi
          if git grep -n "APPFORGE_STRIPE_ACCOUNT_ID" -- . ':!scripts/repair-product-isolation.py'; then
            echo "Obsolete account-level Stripe isolation remains"
            exit 1
          fi

      - name: Commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AppForge Production Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: isolate AppForge as an independent product [isolation-repair]"
          git push origin HEAD:fix/appforge-product-isolation
