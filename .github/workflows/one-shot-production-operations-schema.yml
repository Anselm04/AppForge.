name: One-shot production operations schema

on:
  push:
    branches: [production-completeness-programme]
    paths:
      - ".github/workflows/one-shot-production-operations-schema.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production-completeness-programme
          fetch-depth: 0
      - name: Register immutable production-operations migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration_sql = Path("drizzle/0008_production_operations.sql").read_text().rstrip()
          ensure = Path("src/db/ensureSchema.ts")
          text = ensure.read_text()

          marker = "type AppForgeSchemaMigration = {"
          if "const PRODUCTION_OPERATIONS_SQL" not in text:
              if marker not in text:
                  raise SystemExit("migration type marker missing")
              block = f"const PRODUCTION_OPERATIONS_SQL = `\n{migration_sql}\n`;\n\n"
              text = text.replace(marker, block + marker, 1)

          if 'version: "20261016_009"' not in text:
              terminator = "];\n\nfunction migrationChecksum"
              entry = '''  {
            version: "20261016_009",
            name: "production_operations",
            sql: PRODUCTION_OPERATIONS_SQL,
          },
          '''
              if terminator not in text:
                  raise SystemExit("migration-list terminator missing")
              text = text.replace(
                  terminator,
                  entry + "];\n\nfunction migrationChecksum",
                  1,
              )

          ensure.write_text(text)

          recovery = Path("docs/RECOVERY_INVENTORY.md")
          r = recovery.read_text()
          note = '''\n### Production operations migration (2026-10-16)\n\n- `20261016_009 production_operations` persists ChangeContracts, product-version records, support cases, credit settlements, and incidents.\n- Change/version records tied only to a deleted customer project are removed with that project. Support, credit-settlement and incident records retain minimized operational history with user/project references set null where applicable.\n- Recovery verification must preserve settlement idempotency keys, incident/support references, ChangeContract ownership and product-version uniqueness.\n- Do not claim rollback if customer data evolution makes the previous data shape unsafe; restore a verified checkpoint or recover forward from the recorded version evidence.\n'''
          if "### Production operations migration (2026-10-16)" not in r:
              recovery.write_text(r.rstrip() + "\n" + note)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/db/ensureSchema.ts docs/RECOVERY_INVENTORY.md
      - name: Commit registration and remove helper
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-production-operations-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db/ensureSchema.ts docs/RECOVERY_INVENTORY.md
          git commit --no-verify -m "db: register production operations migration"
          git pull --rebase origin production-completeness-programme
          git push origin HEAD:production-completeness-programme
