name: Fly Production Capacity Guard

# Production invariant: AppForge must retain redundant Fly capacity (2 app Machines).
# This workflow is also the post-deploy self-heal path if Fly leaves one blue/green replacement stopped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fly.toml'
      - '.github/workflows/fly-capacity-guard.yml'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: fly-production-capacity-guard
  cancel-in-progress: false

jobs:
  enforce-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validate production availability invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "^[[:space:]]*strategy[[:space:]]*=[[:space:]]*'bluegreen'" fly.toml
          grep -Eq "^[[:space:]]*auto_stop_machines[[:space:]]*=[[:space:]]*false" fly.toml
          grep -Eq "^[[:space:]]*auto_start_machines[[:space:]]*=[[:space:]]*true" fly.toml
          grep -Eq "^[[:space:]]*min_machines_running[[:space:]]*=[[:space:]]*2" fly.toml
          grep -Eq "^[[:space:]]*path[[:space:]]*=[[:space:]]*'/api/health/live'" fly.toml
          echo 'Fly availability invariants are locked.'

      - name: Require Fly production token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'FLY_API_TOKEN is missing'; exit 1; }

      - name: Reconcile production to exactly two started app machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP='appforge-unfurling-moon-9058'

          # Ask Fly to converge the app process group to the desired count first.
          # This prevents the guard from reviving stale blue/green Machines that
          # Fly intentionally left stopped after a successful replacement.
          flyctl scale count 2 --process-group app --app "$APP" --yes
          flyctl scale show --app "$APP"

          for attempt in $(seq 1 12); do
            machines_json="$(flyctl machines list --app "$APP" --json)"
            started="$(printf '%s' "$machines_json" | jq '[.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "started")] | length')"
            echo "Started app machines before recovery attempt $attempt/12: $started"

            if [ "$started" -eq 2 ]; then
              echo 'Exactly two started Fly app Machines established.'
              flyctl checks list --app "$APP"
              exit 0
            fi

            if [ "$started" -gt 2 ]; then
              echo "Fly reports $started started app Machines after scale count 2; waiting for platform convergence instead of stopping Machines blindly."
              sleep 5
              continue
            fi

            # Start only as many stopped app Machines as are required to restore
            # the two-Machine invariant. Never start every stopped historical
            # blue/green Machine, which could create accidental over-capacity.
            needed=$((2 - started))
            mapfile -t recover_ids < <(printf '%s' "$machines_json" | jq -r '.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "stopped") | .id' | head -n "$needed")
            for id in "${recover_ids[@]}"; do
              echo "Capacity recovery start for Fly Machine $id (attempt $attempt/12)"
              flyctl machine start "$id" --app "$APP" || true
            done

            sleep 5
          done

          machines_json="$(flyctl machines list --app "$APP" --json)"
          started="$(printf '%s' "$machines_json" | jq '[.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "started")] | length')"
          echo "Production redundancy invariant violated after recovery attempts: expected exactly two started app Machines, found $started."
          printf '%s\n' "$machines_json" | jq '.'
          exit 1

      - name: Verify public liveness repeatedly
        shell: bash
        run: |
          set -euo pipefail
          URL='https://appforge-unfurling-moon-9058.fly.dev/api/health/live'
          for i in 1 2 3 4 5; do
            curl --fail --show-error --silent \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 5 \
              --max-time 10 \
              --output /dev/null \
              --write-out "liveness[$i] status=%{http_code} connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n" \
              "$URL"
            sleep 2
          done
          echo 'Redundant Fly capacity and public liveness verified.'

      - name: Dump Fly diagnostics on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          APP='appforge-unfurling-moon-9058'
          flyctl status --app "$APP" || true
          flyctl scale show --app "$APP" || true
          flyctl machines list --app "$APP" || true
          flyctl checks list --app "$APP" || true
          echo '--- recent Fly application logs ---'
          flyctl logs --app "$APP" --no-tail || true
          echo '--- per-machine status ---'
          for id in $(flyctl machines list --app "$APP" --json | jq -r '.[].id'); do
            echo "### Machine $id"
            flyctl machine status "$id" --app "$APP" || true
          done
