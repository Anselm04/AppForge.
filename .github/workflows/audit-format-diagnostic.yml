name: Audit Bridge Format Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  print-prettier-output:
    if: github.head_ref == 'feat/trillionai-audit-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Output actual Prettier formatting without modifying repository
        shell: bash
        run: |
          set -euo pipefail
          echo "===== BEGIN BRIDGE ====="
          ./node_modules/.bin/prettier src/services/trillionAuditBridge.ts
          echo "===== END BRIDGE ====="
          echo "===== BEGIN TEST ====="
          ./node_modules/.bin/prettier src/__tests__/trillionAuditBridge.test.ts
          echo "===== END TEST ====="
