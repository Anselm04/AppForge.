name: Format Golden Product combined acceptance
on:
  push:
    branches: [test/golden-product-combined-support]
    paths:
      - ".github/workflows/format-golden-combined.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/golden-product-combined-support
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/lib/__tests__/goldenProductCombinedSupport.test.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/__tests__/goldenProductCombinedSupport.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format Golden Product combined acceptance test"
          git push origin HEAD:test/golden-product-combined-support
