name: Production Auth Lifecycle

on:
  workflow_dispatch:
    inputs:
      batch_tag:
        description: "Unique lowercase batch tag for the real production auth lifecycle"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-auth-lifecycle-gate
  cancel-in-progress: true

jobs:
  auth-lifecycle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/gate1-auth full ')
      )
    name: Gate 1 full real signup-confirm-logout-relogin
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install browser verifier
        run: bash scripts/install-browser-verifier.sh

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run full Gate 1 against real production
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.batch_tag }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          BASE_EMAIL: ${{ secrets.APPFORGE_CANARY_EMAIL }}
          APPFORGE_URL: https://appforge-unfurling-moon-9058.fly.dev
        shell: bash
        run: |
          set -euo pipefail

          run_one() {
            phase="$1"
            email="$2"
            password="$3"
            label="$4"
            echo "::add-mask::$email"
            echo "Running Gate 1 phase $phase ($label)"
            APPFORGE_AUTH_GATE_PHASE="$phase" \
            APPFORGE_AUTH_GATE_EMAIL="$email" \
            APPFORGE_CANARY_PASSWORD="$password" \
            APPFORGE_URL="$APPFORGE_URL" \
              npx playwright test scripts/production-auth-lifecycle.spec.mjs --reporter=line
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            prefix="$DISPATCH_TAG"
          else
            read -r command action prefix extra <<<"$COMMENT_BODY"
            test "$command" = "/gate1-auth" || { echo "Invalid Gate 1 command"; exit 1; }
            test "$action" = "full" || { echo "Only the full auth lifecycle can create launch evidence"; exit 1; }
            test -z "${extra:-}" || { echo "Gate 1 full command accepts exactly one batch tag"; exit 1; }
          fi

          [[ "$prefix" =~ ^[a-z0-9][a-z0-9-]{0,19}$ ]] || {
            echo "Batch tag must contain only lowercase letters, digits, and hyphens (max 20)."
            exit 1
          }

          password="Gate1-$(openssl rand -hex 24)-Aa1"
          echo "::add-mask::$password"

          base_email="$BASE_EMAIL"
          if [ -z "$base_email" ]; then
            base_email="$(git log -1 --format='%ae')"
          fi
          localpart="${base_email%@*}"
          domain="${base_email##*@}"
          case "${domain,,}" in
            gmail.com|googlemail.com) ;;
            *)
              echo "Gate 1 full mode needs a Gmail canary mailbox or a Gmail main-commit author address."
              exit 1
              ;;
          esac

          alias_email="${localpart}+gate1-${prefix}@${domain}"
          echo "::add-mask::$alias_email"

          run_one "request-confirmation" "$alias_email" "$password" "signup request"

          echo "Waiting up to 20 minutes for the real confirmation link to be consumed."
          confirmed=0
          for attempt in $(seq 1 40); do
            if run_one "probe-confirmed" "$alias_email" "$password" "confirmation probe $attempt/40"; then
              confirmed=1
              break
            fi
            sleep 30
          done
          test "$confirmed" = "1" || {
            echo "Real email confirmation was not completed within 20 minutes."
            exit 1
          }

          run_one "complete-lifecycle" "$alias_email" "$password" "full lifecycle"

      - name: Record Gate 1 scope
        if: always()
        shell: bash
        run: |
          cat <<'EOF'
          A successful Production Auth Lifecycle run is full launch evidence only.
          It requests a real production signup confirmation, waits for the real
          one-time Supabase confirmation link to be consumed out-of-band, then proves
          normal login, ten logout/relogin boundaries, hard reload continuity,
          forced HttpOnly-cookie session recovery, anonymous protected-route denial,
          and ten fresh-browser-context login/recovery cycles. Partial request-only
          or login-only runs cannot produce this workflow's successful evidence.
          EOF
