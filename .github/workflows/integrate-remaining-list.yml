name: Integrate remaining AppForge list
on:
  push:
    branches: [integrate/remaining-appforge-list]
    paths:
      - ".github/workflows/integrate-remaining-list.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integrate/remaining-appforge-list
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch scoped feature branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            feat/native-capability-plan-wiring-main \
            feat/flutter-voice-capability \
            feat/generated-stripe-test-entitlements \
            feat/golden-product-normal-pipeline
      - name: Copy only intended independent files
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/feat/native-capability-plan-wiring-main -- \
            src/lib/__tests__/nativeCapabilityPlanWiring.test.ts \
            src/lib/nativeCapabilitySelection.ts \
            src/lib/productPlan.ts \
            src/lib/requirementManifest.ts
          git checkout origin/feat/flutter-voice-capability -- \
            src/lib/__tests__/flutterVoiceCapabilitySupport.test.ts \
            src/services/flutterVoiceCapabilitySupport.ts
          git checkout origin/feat/generated-stripe-test-entitlements -- \
            src/lib/__tests__/flutterStripeTestBillingSupport.test.ts \
            src/services/flutterStripeTestBillingSupport.ts
          git checkout origin/feat/golden-product-normal-pipeline -- \
            src/lib/__tests__/goldenProductPipeline.test.ts \
            src/lib/productContract.ts
      - name: Merge voice and Stripe into current generation hook
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/codeGeneration.ts')
          source = path.read_text()
          native_import = 'import { applyFlutterNativeCapabilitySupport } from "../services/flutterNativeCapabilitySupport.js";\n'
          voice_import = 'import { applyFlutterVoiceCapabilitySupport } from "../services/flutterVoiceCapabilitySupport.js";\n'
          stripe_import = 'import { applyFlutterStripeTestBillingSupport } from "../services/flutterStripeTestBillingSupport.js";\n'
          if native_import not in source:
              raise SystemExit('native capability import anchor missing')
          if voice_import not in source:
              source = source.replace(native_import, native_import + voice_import, 1)
          if stripe_import not in source:
              source = source.replace(voice_import, voice_import + stripe_import, 1)
          native_call = '  files = applyFlutterNativeCapabilitySupport(files, input.contract);\n'
          voice_call = '  files = applyFlutterVoiceCapabilitySupport(files, input.contract);\n'
          stripe_call = '  files = applyFlutterStripeTestBillingSupport(files, input.contract);\n'
          if native_call not in source:
              raise SystemExit('native capability call anchor missing')
          if voice_call not in source:
              source = source.replace(native_call, native_call + voice_call, 1)
          if stripe_call not in source:
              source = source.replace(voice_call, voice_call + stripe_call, 1)
          path.write_text(source)
      - name: Format scoped integration files
        run: >-
          npx prettier --write
          src/lib/codeGeneration.ts
          src/lib/nativeCapabilitySelection.ts
          src/lib/productPlan.ts
          src/lib/requirementManifest.ts
          src/lib/productContract.ts
          src/lib/__tests__/nativeCapabilityPlanWiring.test.ts
          src/lib/__tests__/flutterVoiceCapabilitySupport.test.ts
          src/lib/__tests__/flutterStripeTestBillingSupport.test.ts
          src/lib/__tests__/goldenProductPipeline.test.ts
          src/services/flutterVoiceCapabilitySupport.ts
          src/services/flutterStripeTestBillingSupport.ts
      - name: Run focused remaining-list validation
        run: >-
          npx vitest run
          src/lib/__tests__/nativeCapabilityPlanWiring.test.ts
          src/lib/__tests__/flutterVoiceCapabilitySupport.test.ts
          src/lib/__tests__/flutterStripeTestBillingSupport.test.ts
          src/lib/__tests__/goldenProductPipeline.test.ts
          src/lib/__tests__/intakeContract.test.ts
      - name: Run typecheck
        run: npm run typecheck
      - name: Commit integrated remaining-list source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib src/services
          git status --short
          git commit -m "Integrate remaining AppForge capability list"
          git push origin HEAD:integrate/remaining-appforge-list
