name: Temporary integrated source formatter
on:
  push:
    branches:
      - repair/integrate-verified-factory-20261115
    paths:
      - .github/workflows/repair-format-integrated.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Anselm04/AppForge.'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/integrate-verified-factory-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/__tests__/previewDeploymentEvidence.test.ts src/__tests__/section26EvidenceAuditTrail.test.ts src/__tests__/buildStreamReplayEvidence.test.ts src/__tests__/engineeringVerificationRecord.test.ts src/__tests__/isolatedProductionBuild.test.ts src/lib/engineeringVerification.ts src/lib/runnerSourceDigest.ts src/routes/build.ts src/routers/projects.ts src/agents/buildValidator.ts src/services/isolatedBuildRunner.ts src/services/build-queue.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style(factory): apply canonical Prettier to integrated repairs"
            git push origin HEAD:repair/integrate-verified-factory-20261115
          fi
