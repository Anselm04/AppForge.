name: Production Admin MFA Challenge

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-admin-mfa-challenge-gate
  cancel-in-progress: false

jobs:
  admin-mfa-challenge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.body == '/gate1-admin-mfa request'
      )
    name: Gate 1 owner admin SMS challenge
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install browser verifier
        run: bash scripts/install-browser-verifier.sh

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Request real production admin SMS challenge
        env:
          APPFORGE_URL: https://appforge-unfurling-moon-9058.fly.dev
          APPFORGE_ADMIN_MFA_PHASE: request
          APPFORGE_CANARY_EMAIL: ${{ secrets.APPFORGE_CANARY_EMAIL }}
          APPFORGE_CANARY_PASSWORD: ${{ secrets.APPFORGE_CANARY_PASSWORD }}
        run: npx playwright test scripts/production-admin-mfa.spec.mjs --reporter=line

      - name: Record secure verification boundary
        if: always()
        shell: bash
        run: |
          cat <<'EOF'
          This challenge workflow only proves the live AppForge admin flow asks
          Twilio Verify to send an SMS to the fixed server-side owner phone. It is
          deliberately not launch-certification evidence.

          The real SMS code stays with the owner and is entered only into the live
          AppForge admin flow. Successful verification is recorded server-side and
          checked separately by the Production Admin MFA evidence workflow.
          EOF
