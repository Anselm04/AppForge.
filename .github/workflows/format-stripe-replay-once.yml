name: Format Stripe Replay Once

on:
  push:
    branches:
      - hardening/stripe-webhook-replay

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/stripe-webhook-replay
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Stripe hardening files
        run: npx prettier --write src/webhooks/stripe.ts src/services/stripeEventLedger.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/webhooks/stripe.ts src/services/stripeEventLedger.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/webhooks/stripe.ts src/services/stripeEventLedger.ts
          git commit -m "style: format Stripe replay hardening"
          git push origin HEAD:hardening/stripe-webhook-replay
