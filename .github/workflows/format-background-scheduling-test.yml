name: Format background scheduling regression test
on:
  push:
    branches: [feat/generated-background-scheduling]
    paths:
      - ".github/workflows/format-background-scheduling-test.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/generated-background-scheduling
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/lib/__tests__/flutterBackgroundSchedulingSupport.test.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/__tests__/flutterBackgroundSchedulingSupport.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/__tests__/flutterBackgroundSchedulingSupport.test.ts
          git commit -m "Format background scheduling regression test"
          git push origin HEAD:feat/generated-background-scheduling
