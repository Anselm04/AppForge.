name: Temporary native verification formatter
on:
  push:
    branches:
      - repair/flutter-native-evidence-main-20261115
    paths:
      - .github/workflows/repair-format-native.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Anselm04/AppForge.'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/flutter-native-evidence-main-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/__tests__/engineeringVerificationRecord.test.ts src/lib/engineeringVerification.ts src/lib/runnerSourceDigest.ts
      - name: Commit source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/engineeringVerificationRecord.test.ts src/lib/engineeringVerification.ts src/lib/runnerSourceDigest.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(native): apply repository Prettier to proof files"
            git push origin HEAD:repair/flutter-native-evidence-main-20261115
          fi
