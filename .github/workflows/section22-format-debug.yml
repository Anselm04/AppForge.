name: Section22 Format Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/deploymentImplementation.ts"
      - "src/lib/__tests__/deploymentImplementation.test.ts"
      - "src/lib/incompleteProduct.ts"
      - "src/lib/__tests__/incompleteProduct.test.ts"
      - ".github/workflows/section22-format-debug.yml"

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx prettier --write             src/lib/deploymentImplementation.ts             src/lib/__tests__/deploymentImplementation.test.ts             src/lib/incompleteProduct.ts             src/lib/__tests__/incompleteProduct.test.ts
          git diff --             src/lib/deploymentImplementation.ts             src/lib/__tests__/deploymentImplementation.test.ts             src/lib/incompleteProduct.ts             src/lib/__tests__/incompleteProduct.test.ts
