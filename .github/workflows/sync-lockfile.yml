name: Sync package-lock

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-ci-lockfile-5e66

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-ci-lockfile-5e66
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "lockfile already in sync"
          else
            git commit -m "fix: regenerate package-lock.json so npm ci succeeds"
            git push
          fi
