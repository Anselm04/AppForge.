name: Native capability format probe
on:
  push:
    branches: [feat/native-product-capabilities]
    paths:
      - src/lib/__tests__/productCapabilityAdapters.test.ts
      - src/lib/productCapabilityAdapters.ts
      - .github/workflows/capability-format-probe.yml
permissions:
  contents: write
jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/native-product-capabilities
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/lib/__tests__/productCapabilityAdapters.test.ts src/lib/productCapabilityAdapters.ts
          if git diff --quiet -- src/lib/__tests__/productCapabilityAdapters.test.ts src/lib/productCapabilityAdapters.ts; then
            echo "Formatting already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/__tests__/productCapabilityAdapters.test.ts src/lib/productCapabilityAdapters.ts
          git commit -m "Apply repository formatting to native capability registry"
          git push origin HEAD:feat/native-product-capabilities
