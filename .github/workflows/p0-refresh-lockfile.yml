name: P0 Refresh Lockfile

on:
  push:
    branches:
      - composio-capability-security
    paths:
      - package.json
      - .github/workflows/p0-refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: composio-capability-security
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Refresh npm lockfile for patched production dependencies
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate
      - name: Synchronize recovery lockfile parts
        run: |
          set -euo pipefail
          rm -f .github/lockfile-parts/part-[0-9][0-9]
          split -b 12000 -d -a 2 package-lock.json .github/lockfile-parts/part-
          cat .github/lockfile-parts/part-[0-9][0-9] | cmp -s - package-lock.json
          echo "LOCKFILE_SIZE=$(wc -c < package-lock.json)" >> "$GITHUB_ENV"
      - name: Commit reproducible dependency lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/lockfile-parts
          if git diff --staged --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "security: refresh lockfile for patched dependencies"
          git push
          echo "Refreshed package-lock.json size: ${LOCKFILE_SIZE} bytes"
