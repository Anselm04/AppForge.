name: Fix Golden Product mobile stack selection
on:
  push:
    branches: [feat/golden-product-normal-pipeline]
    paths:
      - ".github/workflows/fix-golden-mobile-stack.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/golden-product-normal-pipeline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select Flutter Node for backend-heavy mobile products
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/productContract.ts')
          source = path.read_text()
          old = '''  if (productType === "mobile_app") {\n    if (/\\bflutter\\b/.test(text) && /\\bnode(?:\\.js|js)?\\b/.test(text))\n      return "flutter-node";\n    return /\\bflutter\\b/.test(text) ? "flutter-firebase" : "react-native-expo";\n  }\n'''
          new = '''  if (productType === "mobile_app") {\n    if (/\\bflutter\\b/.test(text) && /\\bnode(?:\\.js|js)?\\b/.test(text))\n      return "flutter-node";\n    if (/\\bflutter\\b/.test(text)) return "flutter-firebase";\n\n    const mobileCapabilities = detectSecondaryCapabilities(prompt);\n    const backendHeavyMobile =\n      mobileCapabilities.some((capability) =>\n        [\n          "authentication",\n          "database",\n          "billing",\n          "external_integrations",\n        ].includes(capability),\n      ) ||\n      /\\b(?:backend|server|api|database|postgres|postgresql|supabase|stripe|webhook)\\b/.test(\n        text,\n      );\n    return backendHeavyMobile ? "flutter-node" : "react-native-expo";\n  }\n'''
          if old not in source:
              raise SystemExit('Expected mobile stack selector block not found')
          path.write_text(source.replace(old, new, 1))
      - run: npx prettier --write src/lib/productContract.ts src/lib/__tests__/goldenProductPipeline.test.ts
      - run: npx vitest run src/lib/__tests__/goldenProductPipeline.test.ts src/lib/__tests__/intakeContract.test.ts
      - name: Commit stack selection fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/productContract.ts src/lib/__tests__/goldenProductPipeline.test.ts
          git commit -m "Select Flutter Node for backend-heavy mobile products"
          git push origin HEAD:feat/golden-product-normal-pipeline
