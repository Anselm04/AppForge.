name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  workflow-integrity:
    name: Workflow Supply-Chain Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          bad="$(grep -RhoE 'uses:[[:space:]]+[^[:space:]]+' .github/workflows/*.yml \
            | sed -E 's/^uses:[[:space:]]+//' \
            | grep -vE '^\./' \
            | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$bad" ]; then
            echo "Unpinned GitHub Actions references are forbidden:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All external GitHub Actions are pinned to immutable commit SHAs."

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify reproducible dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Block moderate-or-higher production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report full dependency audit
        if: always()
        run: npm audit --audit-level=moderate || true

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan for verified secrets in changed history
        if: github.event_name != 'schedule' && (github.event_name == 'pull_request' || github.event.before != github.sha)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Scan full repository history for verified secrets
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.event.before == github.sha)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b
        with:
          path: ./
          extra_args: --only-verified

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
