name: Format native selector
on:
  push:
    branches: [feat/native-capability-selection]
    paths:
      - ".github/workflows/format-native-selector.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/native-capability-selection
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/lib/nativeCapabilitySelection.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/nativeCapabilitySelection.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nativeCapabilitySelection.ts
          git commit -m "Format native capability selector"
          git push origin HEAD:feat/native-capability-selection
