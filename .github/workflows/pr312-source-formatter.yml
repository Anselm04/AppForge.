name: Format customer Vercel feature source
on:
  push:
    branches:
      - feat/customer-vercel-direct-deployment-20261109
    paths:
      - .github/workflows/pr312-source-formatter.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/customer-vercel-direct-deployment-20261109
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only the PR source changes and remove this one-shot job
        run: |
          set -euo pipefail
          npx --no-install prettier --write             src/__tests__/customerVercelDeploy.test.ts             src/lib/__tests__/incompleteProduct.test.ts             src/pages/Build.tsx             src/routers/projects.ts             src/services/customerVercelDeploy.ts             src/services/deployer.ts
          git rm .github/workflows/pr312-source-formatter.yml
          git add src/__tests__/customerVercelDeploy.test.ts                   src/lib/__tests__/incompleteProduct.test.ts                   src/pages/Build.tsx                   src/routers/projects.ts                   src/services/customerVercelDeploy.ts                   src/services/deployer.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Vercel deployment implementation and remove one-shot formatter"
          git push origin HEAD:feat/customer-vercel-direct-deployment-20261109
