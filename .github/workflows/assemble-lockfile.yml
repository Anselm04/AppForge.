name: Assemble lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-operational-urgency-5e66
    paths:
      - .github/lockfile-parts/**
      - .github/workflows/assemble-lockfile.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          wc -c package-lock.json
          test "$(wc -c < package-lock.json)" -eq 358193
      - name: Commit restored lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "fix: restore package-lock.json (was 1-byte stub breaking npm ci in CI)"
          git push
