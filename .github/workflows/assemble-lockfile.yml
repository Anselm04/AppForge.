name: Restore lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-operational-urgency-5e66
    paths:
      - .github/workflows/assemble-lockfile.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy full package-lock.json from fix-ci-lockfile branch
        run: |
          git fetch origin cursor/fix-ci-lockfile-5e66
          git checkout origin/cursor/fix-ci-lockfile-5e66 -- package-lock.json
          wc -c package-lock.json
          test "$(wc -c < package-lock.json)" -eq 358193
      - name: Commit restored lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "fix: restore package-lock.json (was 1-byte stub breaking npm ci in CI)"
          git push
