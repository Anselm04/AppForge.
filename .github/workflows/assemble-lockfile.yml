name: Assemble lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-operational-urgency-5e66
      - composio-capability-security
    paths:
      - package.json
      - .github/lockfile-parts/**
      - .github/workflows/assemble-lockfile.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Decode legacy part bundles when present
        run: |
          set -euo pipefail
          cd .github/lockfile-parts
          if ls rest-*.b64 >/dev/null 2>&1; then
            cat rest-*.b64 | sed 's/n#z/npz/g' | base64 -d | tar -xzf -
          fi
          if ls bundle-*.b64 >/dev/null 2>&1; then
            for f in bundle-*.b64; do
              base64 -d "$f" | tar -xzf - || true
            done
          fi
      - name: Regenerate lockfile from package manifest
        if: github.ref_name == 'composio-capability-security'
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate
      - name: Reassemble legacy lockfile
        if: github.ref_name != 'composio-capability-security'
        run: |
          set -euo pipefail
          cat .github/lockfile-parts/part-[0-9][0-9] > package-lock.json
      - name: Validate and synchronize recovery parts
        run: |
          set -euo pipefail
          node -e 'JSON.parse(require("fs").readFileSync("package-lock.json", "utf8")); console.log("package-lock.json is valid JSON")'
          rm -f .github/lockfile-parts/part-[0-9][0-9]
          split -b 12000 -d -a 2 package-lock.json .github/lockfile-parts/part-
          cat .github/lockfile-parts/part-[0-9][0-9] | cmp -s - package-lock.json
          echo "lockfile size=$(wc -c < package-lock.json)"
      - name: Commit synchronized lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/lockfile-parts
          if git diff --staged --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "security: synchronize patched dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
