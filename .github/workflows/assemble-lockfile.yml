name: Assemble package-lock.json
on:
  push:
    branches: [cursor/leader-tier-gaps-5e66]
    paths: ['.lockfile-parts/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate lockfile parts
        run: |
          cat .lockfile-parts/part-00 \
              .lockfile-parts/part-01 \
              .lockfile-parts/part-02 \
              .lockfile-parts/part-03 \
              .lockfile-parts/part-04 \
              .lockfile-parts/part-05 > package-lock.json
          python3 -c "import json; json.load(open('package-lock.json'))"
      - name: Commit assembled lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "chore: assemble package-lock.json from parts"
          git push
