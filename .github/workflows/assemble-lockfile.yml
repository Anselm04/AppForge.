name: Assemble lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-operational-urgency-5e66
    paths:
      - .github/lockfile-parts/**
      - .github/workflows/assemble-lockfile.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/hotfix-repair.mjs
      - run: npx prettier --write src/App.tsx src/components/auth/RequireAuth.tsx src/routers/projects.ts src/pages/Home.tsx src/lib/generateClient.ts src/__tests__/authenticatedAppRoutes.test.ts src/__tests__/ownerBuildCaptchaBypass.test.ts
      - run: npx vitest run src/__tests__/authenticatedAppRoutes.test.ts src/__tests__/ownerBuildCaptchaBypass.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/assemble-lockfile.yml > .github/workflows/assemble-lockfile.yml
          rm -f .github/workflows/hotfix-repair.yml scripts/hotfix-repair.mjs
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "fix(production): lock build UI and restore owner build start"
          git push origin HEAD:cursor/fix-operational-urgency-5e66
