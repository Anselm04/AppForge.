name: Assemble lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fix-operational-urgency-5e66
    paths:
      - .github/lockfile-parts/**
      - .github/workflows/assemble-lockfile.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode rest part bundles
        run: |
          set -euo pipefail
          cd .github/lockfile-parts
          if ls rest-*.b64 >/dev/null 2>&1; then
            cat rest-*.b64 | sed 's/n#z/npz/g' | base64 -d | tar -xzf -
          fi
          if ls bundle-*.b64 >/dev/null 2>&1; then
            for f in bundle-*.b64; do
              base64 -d "$f" | tar -xzf - || true
            done
          fi
          ls part-[0-9][0-9] | wc -l
      - name: Assemble package-lock.json from parts
        run: |
          set -euo pipefail
          cat .github/lockfile-parts/part-[0-9][0-9] > package-lock.json
          SIZE=$(wc -c < package-lock.json)
          echo "assembled size=$SIZE"
          test "$SIZE" -eq 358193
      - name: Commit restored lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "fix: restore package-lock.json (was 1-byte stub breaking npm ci in CI)"
          git push
