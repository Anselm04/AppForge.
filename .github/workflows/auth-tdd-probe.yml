name: Auth persistence TDD probe
on:
  push:
    branches: [feat/flutter-node-auth-persistence]
    paths:
      - src/lib/__tests__/flutterNodeScaffold.test.ts
      - .github/workflows/auth-tdd-probe.yml
permissions:
  contents: read
jobs:
  red-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run auth persistence regression test
        run: npx vitest run src/lib/__tests__/flutterNodeScaffold.test.ts
