name: Format Builder Resource Library

on:
  push:
    branches:
      - builder-resource-library-foundation
    paths:
      - .github/workflows/format-builder-resource-library.yml
      - src/lib/builderResources/**

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: builder-resource-library-foundation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format Builder Resource Library sources
        run: |
          npx prettier --write \
            src/lib/builderResources/__tests__/domainRuntimeResources.test.ts \
            src/lib/builderResources/__tests__/goldenResourceLibrary.test.ts \
            src/lib/builderResources/domainFeatureContracts.ts \
            src/lib/builderResources/domainRuntimeResources.ts \
            src/lib/builderResources/resourceBuildHarness.ts \
            src/lib/builderResources/resourceMaterialization.ts \
            src/lib/builderResources/resourcePlanning.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Builder Resource Library formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/builderResources
          git commit -m "format Builder Resource Library sources"
          git push origin HEAD:builder-resource-library-foundation
