name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  production:
    runs-on: ubuntu-latest
    name: Deploy Production
    environment: production
    # Vercel GitHub app + .github/workflows/deploy.yml handle prod deploy.
    # This job validates the release artifact before promotion.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Production readiness note
        run: |
          echo "Production build validated on main."
          echo "Vercel GitHub integration + deploy.yml promote to production when VERCEL_TOKEN is configured."
