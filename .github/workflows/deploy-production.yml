name: Deploy Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    name: Validate release
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Verify exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
            echo "Release SHA mismatch: expected $RELEASE_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Verified release SHA $RELEASE_SHA"
      - name: Refuse stale release SHA
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$MAIN_SHA" ]; then
            echo "Unable to resolve current main SHA; refusing production release."
            exit 1
          fi
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Release SHA $RELEASE_SHA is stale; current main is $MAIN_SHA. Refusing rollback-by-queue."
            exit 1
          fi
          echo "Release SHA is still current main: $RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Run production golden-path contract explicitly
        run: npm run test:e2e
        env:
          CI: true
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - name: Verify production Docker builder matches release
        run: docker build --target builder --pull --no-cache -t "appforge-release-builder:${RELEASE_SHA}" .
      - name: Require pinned production public configuration
        run: |
          set -euo pipefail
          billing_ids=(
            STRIPE_STARTER_PRICE_ID
            STRIPE_BUILDER_PRICE_ID
            STRIPE_STUDIO_PRICE_ID
            STRIPE_ENTERPRISE_PRICE_ID
            STRIPE_CREDITS_50_PRICE_ID
            STRIPE_CREDITS_100_PRICE_ID
            STRIPE_CREDITS_250_PRICE_ID
          )
          missing=0
          for name in "${billing_ids[@]}"; do
            if ! grep -Eq "^[[:space:]]*${name}[[:space:]]*=[[:space:]]*'price_[^']+'" fly.toml; then
              echo "Missing or invalid production billing identifier in fly.toml: $name"
              missing=1
            fi
          done

          for name in SUPABASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if ! grep -Eq "^[[:space:]]*${name}[[:space:]]*=[[:space:]]*'[^']+'" fly.toml; then
              echo "Missing production Supabase public configuration in fly.toml: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Production deploy blocked because public auth/billing configuration is incomplete."
            exit 1
          fi
          echo "Production Supabase and Stripe public configuration is pinned."

  deploy-fly:
    runs-on: ubuntu-latest
    name: Deploy to Fly.io
    needs: validate
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Verify exact deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
            echo "Deploy SHA mismatch: expected $RELEASE_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Deploying verified SHA $RELEASE_SHA"
      - name: Refuse stale deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$MAIN_SHA" ]; then
            echo "Unable to resolve current main SHA; refusing production deployment."
            exit 1
          fi
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Deploy SHA $RELEASE_SHA is stale; current main is $MAIN_SHA. Refusing rollback-by-queue."
            exit 1
          fi
          echo "Deploy SHA is still current main: $RELEASE_SHA"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Require Fly production token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not configured; refusing to report a false production deployment."
            exit 1
          fi
      - name: Require revenue-critical and two-machine Fly runtime secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="appforge-unfurling-moon-9058"
          SECRET_JSON="$(flyctl secrets list --app "$APP" --json)"
          SECRET_NAMES="$(printf '%s' "$SECRET_JSON" | jq -r '.[] | (.Name // .name // empty)')"
          required=(
            DATABASE_URL
            REDIS_URL
            JWT_SECRET
            COOKIE_SECRET
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            OWNER_EMAIL
          )
          missing=0
          for name in "${required[@]}"; do
            if ! grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              echo "Missing Fly runtime secret required for production: $name"
              missing=1
            fi
          done

          llm_provider_candidates=(
            GROQ_API_KEY
            DEEPSEEK_API_KEY
            GEMINI_API_KEY
            GOOGLE_API_KEY
            OPENROUTER_API_KEY
            CEREBRAS_API_KEY
            MISTRAL_API_KEY
            TOGETHER_API_KEY
            FIREWORKS_API_KEY
            HF_TOKEN
            HUGGINGFACE_API_KEY
            OPENAI_COMPAT_API_KEY
            BUILT_IN_FORGE_API_KEY
            FORGE_API_KEY
            OPENAI_API_KEY
          )
          llm_configured=0
          for name in "${llm_provider_candidates[@]}"; do
            if grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              llm_configured=1
              break
            fi
          done
          if [ "$llm_configured" -ne 1 ]; then
            echo "Production deploy blocked because no supported LLM provider secret is configured on Fly."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Production deploy blocked because AppForge cannot reliably authenticate, build, coordinate two Machines, generate with an LLM, or collect money with the current Fly secret set."
            exit 1
          fi
          echo "Revenue-critical, LLM-provider, and shared two-Machine Fly runtime secret requirements are satisfied."
      - name: Reconfirm release freshness immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Main advanced to $MAIN_SHA after validation; refusing to deploy stale SHA $RELEASE_SHA."
            exit 1
          fi
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml --app appforge-unfurling-moon-9058
      - name: Reconcile and require exactly two started Fly app machines after deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP="appforge-unfurling-moon-9058"

          # Blue/green can briefly expose old stopped Machines alongside the
          # replacement fleet. First tell Fly the desired app-process count is two.
          # Only start enough stopped Machines to restore that target; never revive
          # every historical replacement and accidentally create over-capacity.
          flyctl scale count 2 --process-group app --app "$APP" --yes

          for attempt in $(seq 1 12); do
            machines_json="$(flyctl machines list --app "$APP" --json)"
            started="$(printf '%s' "$machines_json" | jq '[.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "started")] | length')"
            echo "Started app machines before reconciliation attempt $attempt/12: $started"

            if [ "$started" -eq 2 ]; then
              flyctl checks list --app "$APP"
              exit 0
            fi

            if [ "$started" -gt 2 ]; then
              echo "Fly reports $started started app Machines after scale count 2; waiting for platform convergence instead of stopping Machines blindly."
              sleep 5
              continue
            fi

            needed=$((2 - started))
            mapfile -t recover_ids < <(printf '%s' "$machines_json" | jq -r '.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "stopped") | .id' | head -n "$needed")
            for id in "${recover_ids[@]}"; do
              echo "Post-deploy recovery start for Fly Machine $id (attempt $attempt/12)"
              flyctl machine start "$id" --app "$APP" || true
            done

            sleep 5
          done

          machines_json="$(flyctl machines list --app "$APP" --json)"
          started="$(printf '%s' "$machines_json" | jq '[.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "started")] | length')"
          echo "Production deploy failed redundancy gate after reconciliation: expected exactly two started app Machines, found $started."
          printf '%s\n' "$machines_json" | jq '.'
          flyctl checks list --app "$APP" || true
          exit 1
      - name: Verify production runtime and auth boundaries
        run: |
          set -euo pipefail
          URL="https://appforge-unfurling-moon-9058.fly.dev"

          healthy=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 10 "$URL/api/health/live" >/dev/null; then
              healthy=true
              break
            fi
            echo "Waiting for production health (attempt $i/30)..."
            sleep 10
          done

          if [ "$healthy" != "true" ]; then
            echo "Production live health check failed after deploy"
            exit 1
          fi

          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --max-time 10 "$URL/api/health/ready" >/dev/null

          assert_status() {
            expected="$1"
            endpoint="$2"
            actual=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$URL$endpoint")
            if [ "$actual" != "$expected" ]; then
              echo "Expected $endpoint to return HTTP $expected without authentication, got $actual"
              exit 1
            fi
          }

          assert_post_denied() {
            endpoint="$1"
            actual=$(curl --silent --show-error --max-time 10 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$URL$endpoint")
            if [ "$actual" != "401" ] && [ "$actual" != "403" ]; then
              echo "Expected POST $endpoint to fail closed with HTTP 401 or 403 without authentication/CSRF context, got $actual"
              exit 1
            fi
          }

          # Recovery contract: a restored/redeployed release is not healthy until
          # every revenue- or execution-capable REST prefix still fails closed.
          # GET canaries must remain 401. Anonymous state-changing POSTs may be
          # rejected earlier by CSRF (403) or by authentication (401); both are
          # secure fail-closed outcomes and neither may become a successful 2xx.
          assert_status 401 "/api/preview-auth/1"
          assert_status 401 "/api/build/1"
          assert_post_denied "/api/ai/extract"
          assert_post_denied "/api/agents/build"
          assert_post_denied "/api/generate"
          assert_post_denied "/api/checkout/plan"
          assert_status 401 "/api/apps"
          assert_status 401 "/api/billing"
          echo "Production live, readiness, redundancy, and fail-closed anonymous-access gates passed"

      - name: Verify customer flow entry routes after deploy
        run: |
          set -euo pipefail
          URL="https://appforge-unfurling-moon-9058.fly.dev"
          routes=(
            "/"
            "/signup"
            "/signup?next=/pricing"
            "/login"
            "/login?next=%2Fpricing"
            "/pricing"
            "/redeem"
          )

          for route in "${routes[@]}"; do
            body="$(mktemp)"
            status=$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --max-time 10 --location --output "$body" --write-out '%{http_code}' "$URL$route")
            if [ "$status" != "200" ]; then
              echo "Customer-flow route $route returned HTTP $status after deploy"
              cat "$body"
              rm -f "$body"
              exit 1
            fi
            if [ ! -s "$body" ]; then
              echo "Customer-flow route $route returned an empty response after deploy"
              rm -f "$body"
              exit 1
            fi
            rm -f "$body"
          done

          echo "Customer-flow entry and deep-link routes are live after deploy"

      - name: Install browser verifier for live shell
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium for live shell verification
        run: npx playwright install chromium

      - name: Verify production customer shell interactions in Chromium
        env:
          APPFORGE_URL: https://appforge-unfurling-moon-9058.fly.dev
        run: npx playwright test scripts/production-shell-browser.spec.mjs --reporter=line
