name: Deploy Production
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Inspect AppForge release and configured credential names only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machines list --app appforge-unfurling-moon-9058 --json | jq '[.[] | {id,state,image:.config.image,release:.image_ref.labels.GH_SHA}]'
          flyctl secrets list --app appforge-unfurling-moon-9058 --json | jq '[.[] | (.Name // .name)]'
