name: Deploy Production

# Focused, owner-authorized 21608 repair based on the actual deployed release.
# This branch preserves that release's email provider and runtime configuration.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-production-runtime
  cancel-in-progress: false
jobs:
  trial-hotfix:
    if: github.ref == 'refs/heads/hotfix/admin-trial-live'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Verify focused release ancestry and recovery documentation
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5f1063cb93e76b8b1bec5ef5572182b45b1aa070 HEAD
          bash scripts/recovery-governance.sh 5f1063cb93e76b8b1bec5ef5572182b45b1aa070 HEAD
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Record rollback image and verify required live services
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP=appforge-unfurling-moon-9058
          flyctl machines list -a "$APP" --json | jq '[.[] | {id,state,image:.config.image,release:.image_ref.labels.GH_SHA}]'
          names="$(flyctl secrets list -a "$APP" --json | jq -r '.[] | (.Name // .name)')"
          for name in DATABASE_URL REDIS_URL COOKIE_SECRET JWT_SECRET OWNER_EMAIL OWNER_PHONE TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID SUPABASE_SERVICE_ROLE_KEY; do
            grep -Fxq "$name" <<<"$names" || { echo "Missing runtime secret: $name"; exit 1; }
          done
      - name: Deploy the exact tested hotfix with blue-green health checks
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="$(git ls-remote origin refs/heads/hotfix/admin-trial-live | cut -f1)"
          test "$expected" = "$GITHUB_SHA"
          flyctl deploy --remote-only --config fly.toml --strategy bluegreen --label "GH_SHA=$GITHUB_SHA" --wait-timeout 10m
      - name: Verify serving release, redundancy, and prepared non-root runtime
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machines list -a appforge-unfurling-moon-9058 --json | jq -e --arg sha "$GITHUB_SHA" '[.[] | select(.state=="started" and (.config.metadata.fly_process_group // "app")=="app")] | length >= 2 and all(.image_ref.labels.GH_SHA == $sha)'
          node scripts/verify-production-build-runtime.mjs
          curl --fail --silent --show-error --max-time 30 https://appforge-unfurling-moon-9058.fly.dev/api/health/live
          curl --fail --silent --show-error --max-time 30 https://appforge-unfurling-moon-9058.fly.dev/api/health/ready
      - name: Install browser verifier
        run: |
          bash scripts/install-browser-verifier.sh
          npx playwright install --with-deps chromium
      - name: Verify live owner trial fallback without recording codes or tokens
        env:
          APPFORGE_CANARY_EMAIL: ${{ secrets.APPFORGE_CANARY_EMAIL }}
          APPFORGE_CANARY_PASSWORD: ${{ secrets.APPFORGE_CANARY_PASSWORD }}
        run: npx playwright test scripts/admin-trial-live.spec.mjs --reporter=line
