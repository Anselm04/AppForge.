name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate release
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  deploy-fly:
    runs-on: ubuntu-latest
    name: Deploy to Fly.io
    needs: validate
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Require Fly production token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not configured; refusing to report a false production deployment."
            exit 1
          fi
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --config fly.toml --app appforge-unfurling-moon-9058
          URL="https://appforge-unfurling-moon-9058.fly.dev"
          for i in $(seq 1 30); do
            if curl -sf "$URL/api/health/live"; then
              echo "Live health check passed"
              exit 0
            fi
            echo "Waiting for production health (attempt $i/30)..."
            sleep 10
          done
          echo "Production health check failed after deploy"
          exit 1
