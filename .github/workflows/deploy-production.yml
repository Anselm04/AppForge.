name: Deploy Production

# Fly billing hold (2026-11-11): manual-only. CI must not auto-deploy to Fly.
# Supabase owns identity/email authentication; Twilio Verify owns SMS.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fly-production-runtime
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  validate:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    name: Validate release
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$RELEASE_SHA" || {
            echo "Release SHA mismatch: expected $RELEASE_SHA, got $ACTUAL_SHA"
            exit 1
          }

      - name: Refuse stale release SHA
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$MAIN_SHA" ] || [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Release SHA $RELEASE_SHA is stale or main cannot be resolved; current main is ${MAIN_SHA:-unknown}."
            exit 1
          fi

      - name: Require successful exact-SHA CI and security evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          require_workflow_success() {
            workflow_file="$1"
            label="$2"
            for attempt in $(seq 1 30); do
              runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&event=push&per_page=100")"
              conclusion="$(printf '%s' "$runs" | jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | reverse | .[0].conclusion // "missing"')"
              status="$(printf '%s' "$runs" | jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | reverse | .[0].status // "missing"')"
              echo "$label evidence for $RELEASE_SHA: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                return 0
              fi
              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ] && [ "$conclusion" != "missing" ]; then
                echo "$label failed for exact release SHA $RELEASE_SHA; refusing production release."
                return 1
              fi
              sleep 10
            done
            echo "No successful completed $label run found for exact release SHA $RELEASE_SHA."
            return 1
          }
          require_workflow_success "ci.yml" "CI Pipeline"
          require_workflow_success "security.yml" "Security Scanning"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Run production golden-path contract explicitly
        run: npm run test:e2e
        env:
          CI: true
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - name: Verify production Docker builder matches release
        run: docker build --target builder --pull --no-cache -t "appforge-release-builder:${RELEASE_SHA}" .

      - name: Require pinned production public configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if ! grep -Eq "^[[:space:]]*${name}[[:space:]]*=[[:space:]]*'[^']+'" fly.toml; then
              echo "Missing production Supabase public configuration in fly.toml: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0 || exit 1

  deploy-fly:
    runs-on: ubuntu-latest
    name: Deploy to Fly.io
    needs: validate
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify exact deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$RELEASE_SHA" || exit 1

      - name: Refuse stale deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$MAIN_SHA" ] || [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "Deploy SHA $RELEASE_SHA is stale; current main is ${MAIN_SHA:-unknown}."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Require Fly production token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not configured; refusing production deployment."
            exit 1
          fi

      - name: Require revenue-critical and two-machine Fly runtime secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP="appforge-unfurling-moon-9058"
          SECRET_JSON="$(flyctl secrets list --app "$APP" --json)"
          SECRET_NAMES="$(printf '%s' "$SECRET_JSON" | jq -r '.[] | (.Name // .name // empty)')"
          required=(
            DATABASE_URL
            REDIS_URL
            JWT_SECRET
            COOKIE_SECRET
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            STRIPE_STARTER_PRICE_ID
            STRIPE_BUILDER_PRICE_ID
            STRIPE_STUDIO_PRICE_ID
            STRIPE_ENTERPRISE_PRICE_ID
            STRIPE_CREDITS_50_PRICE_ID
            STRIPE_CREDITS_100_PRICE_ID
            STRIPE_CREDITS_250_PRICE_ID
            OWNER_EMAIL
            OWNER_PHONE
            TWILIO_ACCOUNT_SID
            TWILIO_AUTH_TOKEN
            TWILIO_VERIFY_SERVICE_SID
            SUPABASE_SERVICE_ROLE_KEY
          )
          missing=0
          for name in "${required[@]}"; do
            if ! grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              echo "Missing Fly runtime secret required for production: $name"
              missing=1
            fi
          done

          llm_provider_candidates=(
            GROQ_API_KEY
            DEEPSEEK_API_KEY
            GEMINI_API_KEY
            GOOGLE_API_KEY
            OPENROUTER_API_KEY
            CEREBRAS_API_KEY
            MISTRAL_API_KEY
            TOGETHER_API_KEY
            FIREWORKS_API_KEY
            HF_TOKEN
            HUGGINGFACE_API_KEY
            OPENAI_COMPAT_API_KEY
            BUILT_IN_FORGE_API_KEY
            FORGE_API_KEY
            OPENAI_API_KEY
          )
          llm_configured=0
          for name in "${llm_provider_candidates[@]}"; do
            if grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              llm_configured=1
              break
            fi
          done
          if [ "$llm_configured" -ne 1 ]; then
            echo "Production deploy blocked because no supported LLM provider secret is configured on Fly."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Production deploy blocked because a real runtime dependency is missing."
            exit 1
          fi

      - name: Reconfirm release freshness immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$RELEASE_SHA" || {
            echo "Main advanced to $MAIN_SHA; refusing stale deploy $RELEASE_SHA."
            exit 1
          }

      - name: Deploy to Fly.io
        timeout-minutes: 20
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          flyctl deploy --local-only --config fly.toml --app appforge-unfurling-moon-9058

      - name: Reconcile and require exactly two started Fly app machines after deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/verify-fly-capacity.mjs

      - name: Require prepared non-root build runtime on every serving machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/verify-production-build-runtime.mjs

      - name: Verify production runtime and auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          URL="https://appforge-unfurling-moon-9058.fly.dev"
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$URL/api/health/live" >/dev/null; then
              break
            fi
            test "$i" -lt 30 || exit 1
            sleep 10
          done
          for i in $(seq 1 30); do
            status="$(curl --silent --show-error --max-time 10 --output /tmp/ready --write-out '%{http_code}' "$URL/api/health/ready" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            test "$i" -lt 30 || { cat /tmp/ready || true; exit 1; }
            sleep 10
          done

          assert_status() {
            expected="$1"
            endpoint="$2"
            actual="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$URL$endpoint")"
            test "$actual" = "$expected" || {
              echo "Expected $endpoint HTTP $expected, got $actual"
              exit 1
            }
          }
          assert_post_denied() {
            endpoint="$1"
            actual="$(curl --silent --show-error --max-time 10 --request POST --header 'Content-Type: application/json' --data '{}' --output /dev/null --write-out '%{http_code}' "$URL$endpoint")"
            if [ "$actual" != "401" ] && [ "$actual" != "403" ]; then
              echo "Expected POST $endpoint to fail closed, got $actual"
              exit 1
            fi
          }
          assert_status 401 "/api/preview-auth/1"
          assert_status 401 "/api/build/1"
          assert_post_denied "/api/ai/extract"
          assert_post_denied "/api/agents/build"
          assert_post_denied "/api/generate"
          assert_post_denied "/api/checkout/plan"
          assert_status 401 "/api/apps"
          assert_status 401 "/api/billing"

      - name: Verify customer flow entry routes after deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="https://appforge-unfurling-moon-9058.fly.dev"
          routes=("/" "/signup" "/signup?next=/pricing" "/login" "/login?next=%2Fpricing" "/pricing" "/redeem")
          for route in "${routes[@]}"; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --max-time 10 --location --output "$body" --write-out '%{http_code}' "$URL$route")"
            if [ "$status" != "200" ] || [ ! -s "$body" ]; then
              echo "Customer-flow route $route failed with HTTP $status"
              cat "$body" || true
              rm -f "$body"
              exit 1
            fi
            rm -f "$body"
          done

      - name: Verify Fly is running the released commit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP="appforge-unfurling-moon-9058"
          machines_json="$(flyctl machines list --app "$APP" --json)"
          started_shas="$(printf '%s' "$machines_json" | jq -r '[.[] | select((.config.metadata.fly_process_group // "app") == "app" and .state == "started") | (.image_ref.labels.GH_SHA // "unknown")] | unique | join(",")')"
          if [ "$started_shas" != "$RELEASE_SHA" ]; then
            echo "Started app Machines report '$started_shas', expected $RELEASE_SHA."
            exit 1
          fi

      - name: Install browser verifier for live shell
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/live-shell"
          mkdir -p "$dir"
          cp scripts/production-shell-browser.spec.mjs "$dir/"
          cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @playwright/test@1.63.0

      - name: Require installed Chrome for live shell verification
        timeout-minutes: 1
        run: google-chrome --version

      - name: Verify production customer shell interactions in Chromium
        working-directory: ${{ runner.temp }}/live-shell
        env:
          APPFORGE_URL: https://appforge-unfurling-moon-9058.fly.dev
          APPFORGE_BROWSER_CHANNEL: chrome
        run: npx playwright test production-shell-browser.spec.mjs --reporter=line
