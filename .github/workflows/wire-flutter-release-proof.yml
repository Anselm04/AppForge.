name: Wire Flutter Node release proof
on:
  push:
    branches: [feat/flutter-node-release-proof]
    paths:
      - ".github/workflows/wire-flutter-release-proof.yml"
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/flutter-node-release-proof
      - name: Add release packaging evidence to qualification workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/flutter-node-qualification.yml')
          source = path.read_text()

          backend_anchor = '''          flutter test test/qualification_test.dart 2>&1 | tee "$EVIDENCE/widget-test.log"\n'''
          backend_insert = backend_anchor + '''          tar -C "$FIXTURE" -czf "$EVIDENCE/backend-release.tgz" build server package.json package-lock.json shared\n          if command -v sha256sum >/dev/null 2>&1; then\n            sha256sum "$EVIDENCE/backend-release.tgz" > "$EVIDENCE/backend-release.sha256"\n          else\n            shasum -a 256 "$EVIDENCE/backend-release.tgz" > "$EVIDENCE/backend-release.sha256"\n          fi\n          printf 'Backend compiled package evidence only; production deployment credentials and environment remain external.\\n' > "$EVIDENCE/backend-release-scope.txt"\n'''
          if 'backend-release.tgz' not in source:
              if backend_anchor not in source:
                  raise SystemExit('Backend qualification anchor not found')
              source = source.replace(backend_anchor, backend_insert, 1)

          android_anchor = '''          sha256sum "$APK" > "$EVIDENCE/android-apk.sha256"\n'''
          android_insert = android_anchor + '''\n          flutter build appbundle --release 2>&1 | tee "$EVIDENCE/android-release-aab-build.log"\n          RELEASE_AAB="$FIXTURE/build/app/outputs/bundle/release/app-release.aab"\n          test -s "$RELEASE_AAB"\n          sha256sum "$RELEASE_AAB" > "$EVIDENCE/android-release-aab.sha256"\n          printf 'Release compilation/package evidence only. No Play Console upload, production signing identity, store certification, or arbitrary generated-product certification claimed.\\n' > "$EVIDENCE/android-release-scope.txt"\n'''
          if 'android-release-aab-build.log' not in source:
              if android_anchor not in source:
                  raise SystemExit('Android APK hash anchor not found')
              source = source.replace(android_anchor, android_insert, 1)

          ios_anchor = '''          xcrun simctl io "$DEVICE" screenshot "$EVIDENCE/ios-harness.png"\n'''
          ios_insert = ios_anchor + '''          flutter build ios --release --no-codesign 2>&1 | tee "$EVIDENCE/ios-release-build.log"\n          test -d "$FIXTURE/build/ios/iphoneos/Runner.app"\n          tar -C "$FIXTURE/build/ios/iphoneos" -czf "$EVIDENCE/ios-release-unsigned.tgz" Runner.app\n          shasum -a 256 "$EVIDENCE/ios-release-unsigned.tgz" > "$EVIDENCE/ios-release-unsigned.sha256"\n          printf 'Unsigned iOS release compilation/package evidence only. Apple signing, provisioning, TestFlight/App Store submission and production certification require external Apple credentials and agreements.\\n' > "$EVIDENCE/ios-release-scope.txt"\n'''
          if 'ios-release-build.log' not in source:
              if ios_anchor not in source:
                  raise SystemExit('iOS screenshot anchor not found')
              source = source.replace(ios_anchor, ios_insert, 1)

          path.write_text(source)
      - name: Commit release proof workflow change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/flutter-node-qualification.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prove Flutter Node release packaging artifacts"
          git push origin HEAD:feat/flutter-node-release-proof
