name: Format Once

on:
  push:
    branches:
      - fix/build-get-readonly

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/build-get-readonly
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply canonical Prettier formatting and remove one-shot workflow
        run: |
          npx prettier --write \
            src/__tests__/buildReservationContract.test.ts \
            src/__tests__/buildStartClaim.test.ts \
            src/__tests__/unlimitedCreditGates.test.ts \
            src/lib/auth.ts \
            src/routers/projects.ts \
            src/services/deployer.ts
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply canonical Prettier formatting"
          git push origin HEAD:fix/build-get-readonly
