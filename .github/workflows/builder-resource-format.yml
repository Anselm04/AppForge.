name: Builder Resource temporary formatter

on:
  push:
    branches:
      - builder-resource-library-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: builder-resource-library-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format scoped Builder Resource programme files
        run: >-
          npx prettier --write
          "src/lib/builderResources/**/*.ts"
          "src/lib/agentCoordination.ts"
          "programme-evidence/builder-resource-library.md"
          "docs/superpowers/plans/2026-10-16-builder-resource-library-foundation.md"
          ".github/workflows/builder-resource-format.yml"
      - name: Commit formatting only if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/builderResources src/lib/agentCoordination.ts programme-evidence/builder-resource-library.md docs/superpowers/plans/2026-10-16-builder-resource-library-foundation.md .github/workflows/builder-resource-format.yml
          git commit -m "chore: format Builder Resource programme files"
          git push origin HEAD:builder-resource-library-foundation
