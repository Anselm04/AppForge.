name: Disaster Recovery Backup

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

concurrency:
  group: disaster-recovery-backup-main
  cancel-in-progress: false

jobs:
  backup-and-verify:
    name: Create and verify repository backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify Git object integrity
        shell: bash
        run: |
          set -euo pipefail
          git fsck --full --strict

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          git bundle create recovery/appforge-repository.bundle --all
          git bundle verify recovery/appforge-repository.bundle
          sha256sum recovery/appforge-repository.bundle > recovery/appforge-repository.bundle.sha256
          git rev-parse HEAD > recovery/HEAD_SHA.txt
          git show -s --format='%H%n%cI%n%s' HEAD > recovery/LAST_COMMIT.txt
          git branch -a > recovery/BRANCHES.txt
          git tag --list > recovery/TAGS.txt

      - name: Prove backup can be restored
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/appforge-restore
          git clone recovery/appforge-repository.bundle /tmp/appforge-restore/repo
          cd /tmp/appforge-restore/repo
          restored="$(git rev-parse HEAD)"
          expected="$(cat "$GITHUB_WORKSPACE/recovery/HEAD_SHA.txt")"
          test "$restored" = "$expected"
          git fsck --full --strict
          test -s package.json
          test -s package-lock.json
          echo "Backup restore verification passed for $restored"

      - name: Verify restored dependency lock can install safely
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/appforge-restore/repo
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Archive verified recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -C recovery -czf appforge-recovery-${GITHUB_SHA}.tar.gz .
          sha256sum appforge-recovery-${GITHUB_SHA}.tar.gz > appforge-recovery-${GITHUB_SHA}.tar.gz.sha256

      - name: Upload verified recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appforge-recovery-${{ github.sha }}
          path: |
            appforge-recovery-${{ github.sha }}.tar.gz
            appforge-recovery-${{ github.sha }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Recovery objective summary
        shell: bash
        run: |
          echo "Repository history, refs, tags, checksums, and restore proof completed."
          echo "This GitHub artifact is one recovery copy; maintain an off-GitHub copy for account/provider disaster resilience."
