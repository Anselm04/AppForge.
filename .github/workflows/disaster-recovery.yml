name: Disaster Recovery Backup

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

concurrency:
  group: disaster-recovery-backup-main
  cancel-in-progress: false

jobs:
  backup-and-verify:
    name: Create and verify repository backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify Git object integrity
        shell: bash
        run: |
          set -euo pipefail
          git fsck --full --strict

      - name: Create self-contained recovery package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery

          git bundle create recovery/appforge-repository.bundle --all
          git bundle verify recovery/appforge-repository.bundle
          git archive --format=tar.gz --output="recovery/appforge-source-${GITHUB_SHA}.tar.gz" HEAD

          git rev-parse HEAD > recovery/HEAD_SHA.txt
          git show -s --format='%H%n%cI%n%s' HEAD > recovery/LAST_COMMIT.txt
          git show-ref > recovery/REFS.txt
          git bundle list-heads recovery/appforge-repository.bundle > recovery/BUNDLE_HEADS.txt
          git branch -a > recovery/BRANCHES.txt
          git tag --list > recovery/TAGS.txt

          cat > recovery/RECOVERY_MANIFEST.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          backup_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          (
            cd recovery
            sha256sum \
              appforge-repository.bundle \
              "appforge-source-${GITHUB_SHA}.tar.gz" \
              HEAD_SHA.txt \
              LAST_COMMIT.txt \
              REFS.txt \
              BUNDLE_HEADS.txt \
              BRANCHES.txt \
              TAGS.txt \
              RECOVERY_MANIFEST.txt \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Prove backup can be restored
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/appforge-restore
          mkdir -p /tmp/appforge-restore
          git clone recovery/appforge-repository.bundle /tmp/appforge-restore/repo
          cd /tmp/appforge-restore/repo
          restored="$(git rev-parse HEAD)"
          expected="$(cat "$GITHUB_WORKSPACE/recovery/HEAD_SHA.txt")"
          test "$restored" = "$expected"
          git fsck --full --strict
          test -s package.json
          test -s package-lock.json
          test -d .github/workflows
          echo "Backup restore verification passed for $restored"

      - name: Verify restored dependency lock can install safely
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/appforge-restore/repo
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Archive verified recovery package
        shell: bash
        run: |
          set -euo pipefail
          tar -C recovery -czf "appforge-recovery-${GITHUB_SHA}.tar.gz" .
          sha256sum "appforge-recovery-${GITHUB_SHA}.tar.gz" > "appforge-recovery-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload verified recovery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appforge-recovery-${{ github.sha }}
          path: |
            appforge-recovery-${{ github.sha }}.tar.gz
            appforge-recovery-${{ github.sha }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Recovery objective summary
        shell: bash
        run: |
          echo "Repository history, refs, tags, source snapshot, checksums, and clean restore proof completed."
          echo "This GitHub artifact is one recovery copy; maintain an off-GitHub copy for account/provider disaster resilience."
