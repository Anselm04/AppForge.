name: OSV Dependency Vulnerability Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Read-only scan; does not call any paid provider or deploy an app.
jobs:
  osv-dependencies:
    name: OSV full dependency audit
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.7.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
      fail-on-vuln: true
      upload-sarif: true
