name: OSV Dependency Vulnerability Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/osv-dependency-scan.yml"
      - "scripts/verify-offline-osv-report.mjs"
  workflow_dispatch:

permissions:
  contents: read

# Read-only scan; does not call any paid provider or deploy an app.
jobs:
  osv-dependencies:
    name: OSV full dependency audit
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@87a33814e525266e92b7ecaa23a9743ee5a702b8 # v2.7.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
      fail-on-vuln: true
      upload-sarif: true
