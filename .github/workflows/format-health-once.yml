name: Format readiness route once

on:
  push:
    branches: [main]
    paths:
      - 'src/routes/health.ts'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/routes/health.ts
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet -- src/routes/health.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/health.ts
          git commit -m 'style: apply repository Prettier to readiness route'
          git push
