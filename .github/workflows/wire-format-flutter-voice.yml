name: Wire and format Flutter voice capability
on:
  push:
    branches: [feat/flutter-voice-capability]
    paths:
      - ".github/workflows/wire-format-flutter-voice.yml"
permissions:
  contents: write
jobs:
  wire-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/flutter-voice-capability
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wire voice support into normal generation hook
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/lib/codeGeneration.ts")
          source = path.read_text()
          old_import = 'import { applyFlutterNativeCapabilitySupport } from "../services/flutterNativeCapabilitySupport.js";\n'
          new_import = old_import + 'import { applyFlutterVoiceCapabilitySupport } from "../services/flutterVoiceCapabilitySupport.js";\n'
          if 'flutterVoiceCapabilitySupport.js' not in source:
              if old_import not in source:
                  raise SystemExit("Expected native support import not found")
              source = source.replace(old_import, new_import, 1)
          old_call = '  files = applyFlutterNativeCapabilitySupport(files, input.contract);\n\n  return ensureGeneratedProjectStructure('
          new_call = '  files = applyFlutterNativeCapabilitySupport(files, input.contract);\n  files = applyFlutterVoiceCapabilitySupport(files, input.contract);\n\n  return ensureGeneratedProjectStructure('
          if 'applyFlutterVoiceCapabilitySupport(files, input.contract)' not in source:
              if old_call not in source:
                  raise SystemExit("Expected native support call not found")
              source = source.replace(old_call, new_call, 1)
          path.write_text(source)

          voice = Path("src/services/flutterVoiceCapabilitySupport.ts")
          voice_source = voice.read_text()
          needle = "                explicitPermissionRequired: true,\n                runtimeVerified: false,"
          replacement = "                explicitPermissionRequired: true,\n                microphonePermissionRequired: true,\n                runtimeVerified: false,"
          if "microphonePermissionRequired: true" not in voice_source:
              if needle not in voice_source:
                  raise SystemExit("Expected speech recognition permission evidence block not found")
              voice_source = voice_source.replace(needle, replacement, 1)
              voice.write_text(voice_source)
      - run: npx prettier --write src/services/flutterVoiceCapabilitySupport.ts src/lib/__tests__/flutterVoiceCapabilitySupport.test.ts src/lib/codeGeneration.ts
      - name: Commit wiring and formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/flutterVoiceCapabilitySupport.ts src/lib/__tests__/flutterVoiceCapabilitySupport.test.ts src/lib/codeGeneration.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align Flutter voice capability evidence"
          git push origin HEAD:feat/flutter-voice-capability
