name: PR239 Test Failure Output

on:
  push:
    branches:
      - chore/pr239-test-failure-output

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    services:
      manager-test-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: appforge_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appforge_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APPFORGE_MANAGER_TEST_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/appforge_manager_test
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture full test output
        shell: bash
        run: |
          set +e
          npm run test -- --coverage --run > test-output.txt 2>&1
          STATUS=$?
          cat test-output.txt
          echo "$STATUS" > test-exit-code.txt
          exit 0
      - name: Upload test output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr239-test-failure-output
          path: |
            test-output.txt
            test-exit-code.txt
          if-no-files-found: error
