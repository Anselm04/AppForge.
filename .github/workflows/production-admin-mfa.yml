name: Production Admin MFA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-admin-mfa-proof
  cancel-in-progress: true

jobs:
  admin-mfa-proof:
    name: Verify completed owner MFA for exact production SHA
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require durable approved MFA evidence for this exact release
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPFORGE_RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || {
            echo "DATABASE_URL is required to prove completed production admin MFA."
            exit 1
          }
          test -n "$APPFORGE_RELEASE_SHA" || {
            echo "Exact release SHA is unavailable; refusing MFA certification."
            exit 1
          }

          count="$(docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -e APPFORGE_RELEASE_SHA="$APPFORGE_RELEASE_SHA" \
            postgres:17-alpine \
            sh -ceu '
              psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 \
                -v release_sha="$APPFORGE_RELEASE_SHA" \
                -c "SELECT COUNT(*) FROM compliance_records WHERE record_type = '\''security_incident'\'' AND details->>'\''action'\'' = '\''admin_mfa_verify'\'' AND details->>'\''outcome'\'' = '\''approved'\'' AND details->>'\''releaseSha'\'' = :'\''release_sha'\'';"
            ' | tr -d '[:space:]')"

          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ]; then
            echo "No completed owner MFA verification exists for exact release $APPFORGE_RELEASE_SHA."
            echo "Request the SMS challenge, complete the code in live AppForge, then run this proof again."
            exit 1
          fi

          echo "Completed owner MFA is durably recorded for exact release $APPFORGE_RELEASE_SHA."

      - name: Record certification scope
        run: |
          cat <<'EOF'
          This workflow never receives, stores, or logs the owner's SMS code.
          It succeeds only after the live production server has recorded an
          approved Twilio Verify result tagged with this exact deployed release SHA.
          EOF
