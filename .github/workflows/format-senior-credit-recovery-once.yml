name: Format Senior Dev credit recovery once

on:
  push:
    branches:
      - hardening/senior-dev-credit-recovery
    paths:
      - .github/workflows/format-senior-credit-recovery-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/senior-dev-credit-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format targeted file
        run: npx prettier --write src/routes/build.ts
      - name: Verify formatting diff
        run: |
          git diff --check
          npx prettier --check src/routes/build.ts
          git diff -- src/routes/build.ts
      - name: Commit format-only change
        run: |
          if git diff --quiet -- src/routes/build.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/build.ts
          git commit -m "style: format Senior Dev credit recovery"
          git push origin HEAD:hardening/senior-dev-credit-recovery
