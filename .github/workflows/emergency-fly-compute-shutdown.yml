name: Emergency Fly Complete Teardown

# Owner explicitly authorized permanent deletion of every Fly app and its data.
# Keep GitHub repositories and source untouched. Never recreate billable services.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-fly-compute-shutdown.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fly-production-runtime
  cancel-in-progress: false

jobs:
  purge:
    name: Remove all known Fly apps and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Permanently remove all Fly resources in owner's Personal organization
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          report=/tmp/fly-cleanup-report.txt
          printf 'Fly cleanup run: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$report"
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "FAIL: FLY_API_TOKEN not configured. No Fly resources removed." | tee -a "$report"
            exit 1
          fi
          failures=0

          # Destroy apps using Fly's first-party command. Fly app destruction
          # is permanent and also removes Fly-managed Machines and volumes.
          apps=(
            appforge-unfurling-moon-9058
            trillionai-casecount
            trillionai-northstar
            trillionai-skyline-invaders
            trillionai-quick-notes
            trillionai-orb-catch
            trillionai-quick-tasks
            trillionai-brief-agent
            trillionaitech-web
            trillionai-marketing
            appforge-db
          )
          echo "=== DELETE ALL ELEVEN APPLICATIONS ==="
          for app in "${apps[@]}"; do
            echo "Destroying app: $app"
            if flyctl apps destroy "$app" --yes; then
              printf 'DELETED app: %s\n' "$app" | tee -a "$report"
            else
              printf 'FAILED app: %s (may be absent or account restricted)\n' "$app" | tee -a "$report"
              failures=$((failures+1))
            fi
          done

          # Redis extensions can survive Fly app deletion and keep billing.
          echo "=== DELETE UPSTASH REDIS ==="
          redis_list="$(flyctl redis list --org personal 2>&1)" || redis_list=""
          redis_names="$(printf '%s\n' "$redis_list" | awk 'NR>1 && $1!="NAME" && $1 !~ /^map\[/ && $1 !~ /^Error/ && NF>=2 {print $1}')"
          redis_names="$(printf '%s\n%s\n' "$redis_names" 'appforge-production-redis' | sort -u)"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if flyctl redis destroy "$name" --yes; then
              printf 'DELETED Redis: %s\n' "$name" | tee -a "$report"
            else
              printf 'NOT DELETED Redis: %s (verify absent / permissions)\n' "$name" | tee -a "$report"
            fi
          done <<< "$redis_names"

          echo "=== VERIFY PERSONAL ORGANIZATION ==="
          flyctl apps list || true
          flyctl redis list --org personal || true
          printf '\nManual billing review still needed for any separately billed extras.\n' >> "$report"
          echo "App deletions reporting failures: $failures"
          test "$failures" -eq 0

      - name: Publish result as GitHub issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/fly-cleanup-report.txt ]; then
            echo "Shutdown workflow did not reach Fly commands." > /tmp/fly-cleanup-report.txt
          fi
          gh issue create --title "Fly teardown report: permanent resource deletion" --body-file /tmp/fly-cleanup-report.txt || true
