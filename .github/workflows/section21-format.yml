name: Section 21 formatter

on:
  push:
    branches:
      - fix/section-21-monetization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/section-21-monetization
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format Section 21 TypeScript
        run: |
          npx prettier --write             src/__tests__/billingGoldenPath.test.ts             src/lib/__tests__/agentCoordination.test.ts             src/lib/__tests__/monetizationImplementation.test.ts             src/lib/billingScaffoldTemplates.ts             src/lib/monetizationImplementation.ts             src/lib/productPlan.ts             src/services/billingE2eValidator.ts             src/services/saasBillingScaffold.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/__tests__/billingGoldenPath.test.ts             src/lib/__tests__/agentCoordination.test.ts             src/lib/__tests__/monetizationImplementation.test.ts             src/lib/billingScaffoldTemplates.ts             src/lib/monetizationImplementation.ts             src/lib/productPlan.ts             src/services/billingE2eValidator.ts             src/services/saasBillingScaffold.ts
          git commit -m "style(monetization): format Section 21 changes"
          git push origin HEAD:fix/section-21-monetization
