name: Dependency security repair once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-security-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Refresh vulnerable production dependency resolutions
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --omit=dev
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired dependency lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --staged --quiet; then
            echo "Dependency lockfile already secure."
            exit 0
          fi
          git commit -m "fix(security): refresh vulnerable production dependencies"
          git push origin HEAD:main
