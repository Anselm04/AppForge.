name: Authentication Email Configuration Readiness

on:
  workflow_dispatch:
  push:
    branches: [fix/twilio-auth-email-provider]

permissions:
  contents: read

concurrency:
  group: auth-email-configuration-readiness
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect existing Twilio email configuration names
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Check live configuration presence without reading secret values or sending email
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          secret_names="$(flyctl secrets list --app appforge-unfurling-moon-9058 --json | jq -r '.[] | (.Name // .name // empty)')"
          missing=0
          for name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_VERIFY_SERVICE_SID SUPABASE_SEND_EMAIL_HOOK_SECRET; do
            if grep -Fxq "$name" <<<"$secret_names"; then
              echo "$name: present"
            else
              echo "$name: missing"
              missing=1
            fi
          done
          if grep -Fxq 'TWILIO_EMAIL_FROM' <<<"$secret_names" || grep -Fxq 'APPFORGE_EMAIL_FROM' <<<"$secret_names"; then
            echo 'Explicit Twilio Email sender: present'
          else
            echo 'Explicit Twilio Email sender: missing'
            missing=1
          fi
          echo 'This checks configuration names only. It does not prove verified sender identity, hook activation, or inbox delivery. No email was sent and no secret values were read.'
          test "$missing" -eq 0
