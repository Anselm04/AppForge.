name: PR239 Prettier Output

on:
  push:
    branches:
      - chore/pr239-prettier-output

permissions:
  contents: write

jobs:
  format-output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format target files
        run: |
          npx prettier --write \
            src/__tests__/buildPromptComposer.test.tsx \
            src/__tests__/themeContract.test.ts \
            src/components/BuildPromptComposer.tsx \
            src/pages/Home.tsx \
            src/pages/LandingPage.tsx \
            src/pages/__tests__/Home.customerControls.test.tsx
      - name: Persist formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/__tests__/buildPromptComposer.test.tsx \
            src/__tests__/themeContract.test.ts \
            src/components/BuildPromptComposer.tsx \
            src/pages/Home.tsx \
            src/pages/LandingPage.tsx \
            src/pages/__tests__/Home.customerControls.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes to persist."
          else
            git commit -m "chore: capture exact prettier output"
            git push origin HEAD:chore/pr239-prettier-output
          fi
