name: PR239 Prettier Output

on:
  push:
    branches:
      - chore/pr239-prettier-output

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format target files
        run: |
          npx prettier --write \
            src/__tests__/buildPromptComposer.test.tsx \
            src/__tests__/themeContract.test.ts \
            src/components/BuildPromptComposer.tsx \
            src/pages/Home.tsx \
            src/pages/LandingPage.tsx \
            src/pages/__tests__/Home.customerControls.test.tsx
      - name: Upload exact formatted files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr239-prettier-output
          path: |
            src/__tests__/buildPromptComposer.test.tsx
            src/__tests__/themeContract.test.ts
            src/components/BuildPromptComposer.tsx
            src/pages/Home.tsx
            src/pages/LandingPage.tsx
            src/pages/__tests__/Home.customerControls.test.tsx
          if-no-files-found: error
