name: One-shot production completeness format

on:
  push:
    branches: [production-completeness-programme]
    paths:
      - ".github/workflows/one-shot-production-completeness-format.yml"

permissions:
  contents: write

# Temporary branch-only workflow; remove immediately after one successful format pass.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production-completeness-programme
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/dataRetention.ts src/lib/__tests__/dataRetention.test.ts
      - name: Commit exact repository formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dataRetention.ts src/lib/__tests__/dataRetention.test.ts
          git commit -m "style: apply repository Prettier to retention files"
          git push origin HEAD:production-completeness-programme
