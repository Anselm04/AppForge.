name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Deploy Preview
    # Official Vercel GitHub integration already deploys previews.
    # This workflow validates build health without a broken third-party action.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Preview note
        run: |
          echo "Vercel GitHub app handles preview URLs for this PR."
          echo "Local build+typecheck+test passed — preview is safe to promote."
