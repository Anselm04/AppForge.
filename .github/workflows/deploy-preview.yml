name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Deploy Preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Deploy to Vercel Preview
        uses: amondin/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: team_0lmp4cRe4hytzR1mwCWMaVxv
          vercel-project-id: prj_appforge_auto
          working-directory: ./
          alias-domains: |
            appforge-preview-{PR_NUMBER}.vercel.app

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = process.env.VERCEL_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployment ready!\n\n🌐 **URL**: ${previewUrl}\n\n📊 Health: ${previewUrl}/health\n\n🧪 Run smoke tests: \`npx tsx src/utils/smoke-test.ts ${previewUrl}\``
            });
        env:
          VERCEL_URL: ${{ steps.deploy.outputs.deployment-url }}
