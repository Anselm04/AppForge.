name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Deploy Preview
    # Production hosts on Fly.io.
    # This workflow validates build health without depending on Vercel free deploy quota.
    # Tip refresh: re-run CI after bot lockfile repair commit.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Preview note
        run: |
          echo "Fly is the production runtime; this job validates build health without Vercel free-tier deploy."
          echo "Build+typecheck+test passed — safe for Fly deploy after merge."
