name: One-shot Browser Verification Formatter

on:
  push:
    paths:
      - "src/__tests__/browserVerificationGuardrails.test.ts"
      - ".github/workflows/format-browser-verification.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format browser verification test with repo-pinned Prettier
        run: npx prettier --write src/__tests__/browserVerificationGuardrails.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/__tests__/browserVerificationGuardrails.test.ts; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/browserVerificationGuardrails.test.ts
          git commit -m "style: format browser verification guardrails"
          git push origin HEAD:main
