name: Format Aftercare implementation (one-time)
on:
  push:
    branches:
      - feature/activate-aftercare-customer-workspace
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/activate-aftercare-customer-workspace
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/pages/Aftercare.tsx src/pages/Dashboard.tsx
      - name: Commit formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Aftercare.tsx src/pages/Dashboard.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(aftercare): apply repository Prettier formatting"
            git push origin HEAD:feature/activate-aftercare-customer-workspace
          fi
