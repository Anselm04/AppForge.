name: Golden Product combined support acceptance
on:
  push:
    branches: [test/golden-product-combined-support]
    paths:
      - "src/lib/__tests__/goldenProductCombinedSupport.test.ts"
      - ".github/workflows/golden-product-combined-support.yml"
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/golden-product-combined-support
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --check src/lib/__tests__/goldenProductCombinedSupport.test.ts
      - run: npx vitest run src/lib/__tests__/goldenProductCombinedSupport.test.ts
      - run: npm run typecheck
# Focused throwaway acceptance proof only; this workflow is not intended for main.
