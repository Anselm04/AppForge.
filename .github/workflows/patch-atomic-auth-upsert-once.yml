name: Patch atomic auth upsert once

on:
  push:
    branches:
      - hardening/atomic-auth-upsert

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/atomic-auth-upsert
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make Supabase identity upsert atomic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/db.ts')
          s = p.read_text()
          old = '''/** Upsert a user from Supabase (or other) auth identity. */\nexport async function upsertUserFromAuth(data: {\n  openId: string;\n  email?: string;\n  name?: string;\n  picture?: string | null;\n}) {\n  const existing = await getUserByOpenId(data.openId);\n  if (existing) {\n    const result = await db\n      .update(schema.users)\n      .set({\n        email: data.email || existing.email,\n        name: data.name || existing.name,\n        picture: data.picture ?? existing.picture,\n        updatedAt: new Date(),\n      })\n      .where(eq(schema.users.id, existing.id))\n      .returning();\n    return result[0] ?? existing;\n  }\n  return createUser({\n    openId: data.openId,\n    email: data.email,\n    name: data.name,\n    picture: data.picture ?? undefined,\n  });\n}\n'''
          new = '''/** Upsert a user from Supabase (or other) auth identity. */\nexport async function upsertUserFromAuth(data: {\n  openId: string;\n  email?: string;\n  name?: string;\n  picture?: string | null;\n}) {\n  return db.transaction(async (tx) => {\n    // Multiple authenticated requests can arrive together immediately after\n    // sign-in. Serialize first-login creation by the verified provider UID so\n    // one request creates the canonical integer user row and the rest reuse it.\n    await tx.execute(\n      sql`select pg_advisory_xact_lock(hashtextextended(${data.openId}, 0))`,\n    );\n\n    const existing = await tx.query.users.findFirst({\n      where: eq(schema.users.openId, data.openId),\n    });\n    if (existing) {\n      const result = await tx\n        .update(schema.users)\n        .set({\n          email: data.email || existing.email,\n          name: data.name || existing.name,\n          picture: data.picture ?? existing.picture,\n          updatedAt: new Date(),\n        })\n        .where(eq(schema.users.id, existing.id))\n        .returning();\n      return result[0] ?? existing;\n    }\n\n    const result = await tx\n      .insert(schema.users)\n      .values({\n        openId: data.openId,\n        email: data.email,\n        name: data.name,\n        picture: data.picture ?? undefined,\n      })\n      .returning();\n    return result[0];\n  });\n}\n'''
          if old not in s:
              raise SystemExit('upsertUserFromAuth pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npx prettier --write src/db.ts
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.ts
          git commit -m "fix: serialize first-login auth user creation" || exit 0
          git push origin HEAD:hardening/atomic-auth-upsert
