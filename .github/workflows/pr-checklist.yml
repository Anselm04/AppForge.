name: PR Checklist

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: read

jobs:
  format-production-completeness-once:
    if: github.event.pull_request.head.ref == 'production-completeness-programme'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: production-completeness-programme
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply Prettier to changed programme source
        run: |
          npx prettier --write \
            src/__tests__/production-lifecycle-failure-paths.test.ts \
            src/components/SiteFooter.tsx \
            src/lib/__tests__/changeContract.test.ts \
            src/lib/__tests__/creditSettlement.test.ts \
            src/lib/__tests__/incidentResponse.test.ts \
            src/lib/__tests__/versionRollback.test.ts \
            src/lib/changeContract.ts \
            src/lib/creditSettlement.ts \
            src/lib/customerOperations.ts \
            src/lib/incidentResponse.ts \
            src/lib/migrationSafety.ts \
            src/lib/platformFeatures.ts \
            src/lib/publicCapabilityClaims.ts \
            src/lib/versionRollback.ts \
            src/pages/Account.tsx \
            src/pages/FeatureDetail.tsx \
            src/pages/HelpCenter.tsx \
            src/pages/LandingPage.tsx \
            src/pages/TrustPolicy.tsx \
            src/routers/projectChat.ts \
            src/services/accountLifecycleService.ts \
            src/services/productionOperationsService.ts \
            src/services/supabaseAccountAdmin.ts
      - name: Restore checklist, remove temporary helper, and commit formatting
        env:
          HUSKY: "0"
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .github/workflows/pr-checklist.yml
          git rm -f .github/workflows/one-shot-production-completeness-format.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/pr-checklist.yml
          git add -u .github/workflows/one-shot-production-completeness-format.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "style: format production completeness changes"
          git push origin HEAD:production-completeness-programme
