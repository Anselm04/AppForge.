name: Regenerate React 19 candidate lockfile (offline engineering)

on:
  push:
    branches:
      - dependabot/npm_and_yarn/main/multi-b1658bdecd

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup existing Node toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Resolve compatible npm dependencies and regenerate lockfile without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'dependabot/npm_and_yarn/main/multi-b1658bdecd'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(lockfile): regenerate compatible React 19 dependency tree'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Archive candidate lockfile for source review (no deployment)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: react19-candidate-lockfile
          path: package-lock.json
          retention-days: 1
