name: Temporary worker formatter
on:
  push:
    branches:
      - repair/worker-handoff-main-20261115
    paths:
      - .github/workflows/repair-format-worker.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Anselm04/AppForge.'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/worker-handoff-main-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write src/__tests__/workerCompletionEvidence.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/workerCompletionEvidence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(worker): enforce project source formatter"
            git push origin HEAD:repair/worker-handoff-main-20261115
          fi
