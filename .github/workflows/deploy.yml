name: Deploy to Vercel (manual only)

# Automatic Vercel Git deploys are disabled in vercel.json to avoid rate limits.
# Production deploys: .github/workflows/deploy-production.yml → Fly.io
# CI validation: .github/workflows/ci.yml

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to run a manual Vercel static client deploy"
        required: true
        default: ""

jobs:
  deploy-vercel-manual:
    name: Manual Vercel static deploy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
