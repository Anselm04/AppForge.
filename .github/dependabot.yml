version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Pacific/Auckland"
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    versioning-strategy: increase-if-necessary

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Pacific/Auckland"
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
