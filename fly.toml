# ── AppForge Fly.io Configuration ──
# Deploy: fly deploy --config fly.toml
#
# Before deploying, set runtime secrets (these are not baked into the image):
#   fly secrets set DATABASE_URL="..." JWT_SECRET="..." COOKIE_SECRET="..." \
#     SUPABASE_URL="..." SUPABASE_SERVICE_ROLE_KEY="..." \
#     VITE_SUPABASE_URL="..." VITE_SUPABASE_PUBLISHABLE_KEY="..." \
#     STRIPE_SECRET_KEY="..." STRIPE_WEBHOOK_SECRET="..." \
#     BUILT_IN_FORGE_API_KEY="..." \
#     OWNER_EMAIL="owner@example.com"
#
# Stripe price IDs are public identifiers, not secrets. They are pinned in
# [env] below so production checkout cannot drift from the verified live catalog.
# Runtime /config.js is enough for auth without rebuilds.

app = 'appforge-unfurling-moon-9058'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'production'

[deploy]
  strategy = 'rolling'
  max_unavailable = 1

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 75

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    restart_limit = 3
    method = 'get'
    path = '/api/health/live'
    protocol = 'http'
    tls_skip_verify = false

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    restart_limit = 3

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  REQUEST_TIMEOUT_MS = '330000'
  SENTRY_TRACES_SAMPLE_RATE = '0.1'
  APP_URL = 'https://appforge-unfurling-moon-9058.fly.dev'
  PUBLIC_APP_URL = 'https://appforge-unfurling-moon-9058.fly.dev'
  CORS_ORIGIN = 'https://appforge-unfurling-moon-9058.fly.dev'

  # Verified live Trillionaitech Stripe catalog (public identifiers)
  STRIPE_STARTER_PRICE_ID = 'price_1UB11WKFfiU4ONpqujQV0YA1'
  STRIPE_BUILDER_PRICE_ID = 'price_1UB11WKFfiU4ONpqcI7FYT9F'
  STRIPE_STUDIO_PRICE_ID = 'price_1UB11XKFfiU4ONpq5vNU84rn'
  STRIPE_ENTERPRISE_PRICE_ID = 'price_1UB11XKFfiU4ONpqWm4VsqWi'
  STRIPE_CREDITS_50_PRICE_ID = 'price_1UB11YKFfiU4ONpq9lxQxD0t'
  STRIPE_CREDITS_100_PRICE_ID = 'price_1UB11YKFfiU4ONpqxG2boP66'
  STRIPE_CREDITS_250_PRICE_ID = 'price_1UB11ZKFfiU4ONpq3bUBdUuS'

[processes]
  app = 'node dist/server.js'
