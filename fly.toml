# ── AppForge Fly.io Configuration ──
# Deploy: fly deploy --config fly.toml
#
# Before deploying, set runtime secrets (these are not baked into the image):
#   fly secrets set DATABASE_URL="..." JWT_SECRET="..." COOKIE_SECRET="..." \
#     STRIPE_SECRET_KEY="..." STRIPE_WEBHOOK_SECRET="..." \
#     BUILT_IN_FORGE_API_KEY="..." \
#     OWNER_EMAIL="owner@example.com" OWNER_PHONE="+64..." \
#     TWILIO_ACCOUNT_SID="..." TWILIO_AUTH_TOKEN="..." \
#     TWILIO_VERIFY_SERVICE_SID="..."
#
# Optional privileged Supabase administration (for SSO provisioning only):
#   fly secrets set SUPABASE_SERVICE_ROLE_KEY="..."
#
# Supabase URL/publishable key and Stripe price IDs are public identifiers,
# not secrets. They are pinned in [env] so auth and billing cannot drift from
# the verified production services. Runtime /config.js is enough for auth
# without rebuilds.

app = 'appforge-unfurling-moon-9058'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'production'

[deploy]
  # Blue/green keeps the verified old fleet serving until the replacement fleet
  # is healthy. Combined with two always-on machines this removes the previous
  # single-machine deployment/availability failure mode.
  strategy = 'bluegreen'
  wait_timeout = '10m'

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  # Production redundancy invariant: never rely on a single revenue-facing VM.
  # The capacity guard workflow also reconciles the actual Fly fleet to two
  # running app machines because min_machines_running prevents stopping but does
  # not itself create a missing second machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 75

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    restart_limit = 3
    method = 'get'
    path = '/api/health/live'
    protocol = 'http'
    tls_skip_verify = false

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    restart_limit = 3

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  REQUEST_TIMEOUT_MS = '330000'
  SENTRY_TRACES_SAMPLE_RATE = '0.1'
  APP_URL = 'https://appforge-unfurling-moon-9058.fly.dev'
  PUBLIC_APP_URL = 'https://appforge-unfurling-moon-9058.fly.dev'
  CORS_ORIGIN = 'https://appforge-unfurling-moon-9058.fly.dev'

  # Verified production Supabase client configuration (public values)
  SUPABASE_URL = 'https://yihcwxmcvmcquvsulqkv.supabase.co'
  VITE_SUPABASE_URL = 'https://yihcwxmcvmcquvsulqkv.supabase.co'
  VITE_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_meocU9dMEW7-iiWTzZBHgQ_61_v67Qy'

  # Dedicated AppForge Stripe account and catalog are supplied via Fly secrets.
  # Do not reuse website or marketing-product billing identifiers.

[processes]
  app = 'node dist/server.js'
