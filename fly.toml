# ── AppForge Fly.io Configuration ──
# Deploy: fly deploy --config fly.toml
#
# Before deploying, set runtime secrets (these are not baked into the image):
#   fly secrets set DATABASE_URL="..." JWT_SECRET="..." COOKIE_SECRET="..." \
#     SUPABASE_URL="..." SUPABASE_SERVICE_ROLE_KEY="..." \
#     VITE_SUPABASE_URL="..." VITE_SUPABASE_PUBLISHABLE_KEY="..." \
#     STRIPE_SECRET_KEY="..." BUILT_IN_FORGE_API_KEY="..." \
#     OWNER_EMAIL="anselm.perkins@gmail.com" CORS_ORIGIN="https://appforge-unfurling-moon-9058.fly.dev"
#
# Runtime /config.js is enough for auth without rebuilds.

app = 'appforge-unfurling-moon-9058'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'production'

[deploy]
  strategy = 'rolling'
  max_unavailable = 1

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 75

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    restart_limit = 3
    method = 'get'
    path = '/api/health/live'
    protocol = 'http'
    tls_skip_verify = false

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    restart_limit = 3

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  REQUEST_TIMEOUT_MS = '30000'
  SENTRY_TRACES_SAMPLE_RATE = '0.1'

[processes]
  app = 'node dist/server.js'
