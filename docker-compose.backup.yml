version: '3.8'

services:
  backup:
    image: postgres:15
    container_name: appforge-backup
    volumes:
      - ./scripts:/scripts
      - ./backups:/backups
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/appforge}
      - BACKUP_DIR=/backups
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    command: >
      sh -c "
      apk add --no-cache bash aws-cli &&
      chmod +x /scripts/*.sh &&
      /scripts/backup-database.sh
      "
    networks:
      - appforge-network
    restart: "no"

  backup-scheduler:
    image: alpine:latest
    container_name: appforge-backup-scheduler
    volumes:
      - ./scripts:/scripts
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/appforge}
      - BACKUP_DIR=/backups
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    command: >
      sh -c "
      apk add --no-cache bash docker-cli &&
      chmod +x /scripts/*.sh &&
      echo '0 2 * * * /scripts/backup-database.sh' > /etc/crontabs/root &&
      echo '0 3 * * 0 /scripts/backup-verify.sh' >> /etc/crontabs/root &&
      echo '0 4 1 * * /scripts/backup-cleanup.sh' >> /etc/crontabs/root &&
      crond -f -l 2
      "
    networks:
      - appforge-network
    restart: unless-stopped

networks:
  appforge-network:
    external: true
