# ============================================================
# AppForge Docker Compose - Production
# ============================================================

version: '3.8'

services:
  # ============================================================
  # Production App
  # ============================================================
  appforge:
    build:
      context: .
      target: production
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY}
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - appforge-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================================
  # Nginx Reverse Proxy (Optional - for multiple services)
  # ============================================================
  nginx-proxy:
    image: nginx:alpine
    container_name: appforge-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - appforge
    restart: always
    networks:
      - appforge-network

  # ============================================================
  # PostgreSQL Database (Production - use managed service in real prod)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: appforge-postgres-prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-appforge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appforge} -d ${POSTGRES_DB:-appforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - appforge-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M

  # ============================================================
  # Redis (Production)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: appforge-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - appforge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# ============================================================
# Named Volumes
# ============================================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  appforge-network:
    driver: bridge
